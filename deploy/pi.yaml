target: pi
cluster: recipe-db-pi
context: recipe-db-pi
namespace: recipe-db
origin: https://recipes.example.invalid
httpPort: 8080
apiPort: 6445
timeoutSeconds: 900
storageClass: recipe-db-retained
piStorage:
  node: recipe-db-pi
  expectedRootUuid: REPLACE-WITH-VERIFIED-ROOT-UUID
  dataRoot: /srv/recipe-db
volumes:
  recipes: 1Gi
  images: 2Gi
  ratings: 256Mi
  inspirations: 256Mi
  image-inline: 256Mi
  link-extract: 256Mi
  nats: 1Gi
  typesense: 1Gi
  search: 256Mi
  tags: 256Mi
resources:
