  images: 2Gi
  ratings: 256Mi
  inspirations: 256Mi
  image-inline: 256Mi
  link-extract: 256Mi
  nats: 1Gi
  typesense: 1Gi
  search: 256Mi
  redis: 256Mi
  tags: 256Mi
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 512Mi
infrastructure:
