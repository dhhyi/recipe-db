name: Inspirations Sanity Checks

testcases:
  - name: Clear inspirations
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/"
          method: DELETE
        response:
          statusCode: 204

  - name: Seed an existing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          json: ["https://retained.example.com"]
        response:
          statusCode: 201

  - name: Reject malformed JSON without changing the existing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          body: '{"'
        response:
          statusCode: 400
          headers:
            Content-Type: application/problem+json
          json:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Input must be a JSON array of strings.
            code: invalid-input
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          json: ["https://retained.example.com"]

  - name: Reject a non-array without changing the existing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          body: '{"not": "an array"}'
        response:
          statusCode: 400
          headers:
            Content-Type: application/problem+json
          json:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Input must be a JSON array of strings.
            code: invalid-input
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          json: ["https://retained.example.com"]

  - name: Reject mixed types without changing the existing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          body: '["a string", 1234]'
        response:
          statusCode: 400
          headers:
            Content-Type: application/problem+json
          json:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Input must be a JSON array of strings.
            code: invalid-input
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          json: ["https://retained.example.com"]

  - name: Reject an empty array without changing the existing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          json: []
        response:
          statusCode: 400
          headers:
            Content-Type: application/problem+json
          json:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Input must be a JSON array of strings.
            code: invalid-input
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          json: ["https://retained.example.com"]

  - name: Reject invalid input without creating an inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/missing"
          method: PUT
          body: '{"'
        response:
          statusCode: 400
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/missing"
          method: GET
        response:
          statusCode: 404
