name: Inspirations CRUD

testcases:
  - name: Clear inspirations
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/"
          method: DELETE
        response:
          statusCode: 204

  - name: Check no inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 404
          headers:
            Content-Type: application/problem+json
          json:
            type: about:blank
            title: Not Found
            status: 404
            detail: Inspiration not found
            code: inspiration-not-found

  - name: Create inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          json: ["https://www.test.com", "https://example.com"]
        response:
          statusCode: 201

  - name: Probe collection availability without changing inspirations
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations"
          method: HEAD
        response:
          statusCode: 204
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/"
          method: HEAD
        response:
          statusCode: 204

  - name: Check inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          json: ["https://www.test.com", "https://example.com"]

  - name: Create another recipe's inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/5678"
          method: PUT
          json: ["https://other.example.com"]
        response:
          statusCode: 201

  - name: Replace an existing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          json: ["https://replacement.example.com"]
        response:
          statusCode: 201
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          json: ["https://replacement.example.com"]
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/5678"
          method: GET
        response:
          statusCode: 200
          json: ["https://other.example.com"]

  - name: Delete one recipe without changing another
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: DELETE
        response:
          statusCode: 204
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 404
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/5678"
          method: GET
        response:
          statusCode: 200
          json: ["https://other.example.com"]
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          json: ["https://replacement.example.com"]
        response:
          statusCode: 201

  - name: Clear seeded inspirations
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations"
          method: DELETE
        response:
          statusCode: 204

  - name: Verify seeded inspirations were cleared
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 404
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/5678"
          method: GET
        response:
          statusCode: 404

  - name: Repeat empty reset
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/"
          method: DELETE
        response:
          statusCode: 204

  - name: Create inspiration after reset
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: PUT
          json:
            [
              "https://www.test.com",
              "https://example.com",
              "https://www.test2.com",
            ]
        response:
          statusCode: 201

  - name: Check inspiration again
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          json:
            [
              "https://www.test.com",
              "https://example.com",
              "https://www.test2.com",
            ]

  - name: Delete inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: DELETE
        response:
          statusCode: 204

  - name: Check no inspiration again
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: GET
        response:
          statusCode: 404

  - name: Delete a missing inspiration
    steps:
      - type: tavern
        request:
          url: "{{.REST_API}}/inspirations/1234"
          method: DELETE
        response:
          statusCode: 404
          headers:
            Content-Type: application/problem+json
          json:
            type: about:blank
            title: Not Found
            status: 404
            detail: Inspiration not found
            code: inspiration-not-found
