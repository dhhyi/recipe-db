# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-link-extract-test
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-link-extract-test
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - nginx
      - python3
      - python3-pip
    user:
      - RUN python3 -m pip install --user --break-system-packages robotframework robotframework-requests robotframework-tidy
      - ENV PATH="${HOME}/.local/bin:${PATH}"
    root:
      - RUN rm -f /etc/nginx/sites-enabled/default
    files:
      - type: file
        path: /var/www/html/index.html
        content: |
          <!doctype html>
          <html>
            <head>
              <title>Link Extract Fixture</title>
              <meta name="description" content="Fixture page for link extraction">
              <link rel="icon" href="/link-extract-test-fixture/favicon.ico">
              <link rel="canonical" href="http://traefik:3000/link-extract-test-fixture/canonical">
            </head>
            <body>fixture</body>
          </html>
      - type: file
        path: /var/www/html/canonical.html
        content: |
          <!doctype html>
          <html>
            <head><title>Canonical Fallback</title></head>
            <body>canonical</body>
          </html>
      - type: file
        path: /var/www/html/favicon.ico
        base64: aWNvbg==
      - type: file
        path: /etc/nginx/conf.d/default.conf
        content: |
          server {
            listen 80 default_server;
            listen [::]:80 default_server;
            root /var/www/html;

            location = /page { try_files /index.html =404; }
            location = /canonical { try_files /canonical.html =404; }
            location = /plain {
              default_type text/plain;
              return 200 "plain text";
            }
          }
  ports:
    - 80
  environment:
    REST_API: http://traefik:3000
    FIXTURE_API: http://traefik:3000/link-extract-test-fixture
  initialize: sudo /etc/init.d/nginx start
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#5d5dc9"
  extensions:
    - johnpapa.vscode-peacock
extras:
  - traefik
traefik:
  network: intranet
  labels:
    http:
      middlewares:
        link-extract-test-strip:
          stripPrefix:
            prefixes: /link-extract-test-fixture
      services:
        recipe-db-link-extract-test-fixture:
          loadBalancer:
            server:
              port: "80"
      routers:
        link-extract-test-fixture:
          rule: PathPrefix(`/link-extract-test-fixture`)
          entrypoints: rest-internal
          middlewares: link-extract-test-strip
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: test
precommit: |
  python3 --version
  robotidy .
  robot --dryrun --outputdir target .
prettier:
  ignore:
    - "*.robot"
    - target
test: robot --outputdir target .
