# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-mcp-test
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-mcp-test
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      # mise's python@3.13 currently fails to build on dcc://debian, use the apt package instead
      - python3
      - python3-pip
      - nginx
    user:
      - RUN pip install pytest pytest-asyncio mcp httpx --break-system-packages
    root:
      - RUN rm -f /etc/nginx/sites-enabled/default
    files:
      - type: file
        path: /var/www/html/test.jpg
        base64: ""
      - type: file
        path: /etc/nginx/conf.d/default.conf
        content: |
          server {
            listen 80 default_server;
            listen [::]:80 default_server;
            root /var/www/html;
          }
  ports:
    - 80
  environment:
    MISE_IGNORED_CONFIG_PATHS: "/workspaces/*/mise.toml"
    MCP_URL: http://traefik/mcp
    REST_API: http://traefik:3000
    FIXTURE_API: http://traefik:3000/mcp-test-fixture
  initialize: sudo /etc/init.d/nginx start
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#c9ae5d"
  extensions:
    - johnpapa.vscode-peacock
    - ms-python.python
extras:
  - traefik
traefik:
  network: intranet
  labels:
    http:
      middlewares:
        mcp-test-strip:
          stripPrefix:
            prefixes: /mcp-test-fixture
      services:
        recipe-db-mcp-test-fixture:
          loadBalancer:
            server:
              port: "80"
      routers:
        mcp-test-fixture:
          rule: PathPrefix(`/mcp-test-fixture`)
          entrypoints: rest-internal
          middlewares: mcp-test-strip
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: test
test: pytest
precommit: python3 --version
prettier:
  ignore:
    - "*.py"
