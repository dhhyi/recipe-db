[env]
COMPOSE_PROGRESS = "quiet"
BUILDKIT_PROGRESS = "quiet"
COMPOSE_PARALLEL_LIMIT = "2"

[tools]
"aqua:bats-core/bats-core" = "1.13.0"
"aqua:oras-project/oras" = "1.3.6"
"aqua:k3d-io/k3d" = "5.8.3"
"aqua:kubernetes/kubernetes/kubectl" = "1.35.5"
jq = "latest"
node = "26"
"npm:@devcontainers/cli" = "latest"
shellcheck = "latest"
yq = "latest"
ytt = "0.55.4"
"aqua:bazelbuild/bazelisk" = "latest"

[hooks]
postinstall = { task = "setup" }

[tasks.install-deps]
description = "Install repository tooling dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.install-precommit]
description = "Install the repository precommit hook"
file = ".scripts/install-precommit.sh"

[tasks.setup]
description = "Install dependencies and hooks, then synchronize repository configuration"
depends = ["install-deps", "install-precommit"]
run = [{ task = "sync" }]

[tasks.check-forbidden-files]
description = "Check tracked files for forbidden ignore-file locations"
file = ".scripts/check-forbidden-files.sh"

[tasks.test-scripts]
description = "Run repository script regression tests with Bats"
run = "bash .scripts/test-scripts.sh"
raw_args = true

[tasks.bazel]
description = "Run Bazel with a stable Mise and system tool PATH"
run = "bash .scripts/bazel.sh"
raw_args = true

[tasks.test-message-bus]
description = "Validate GraphQL events, fan-out, outages and broker restart against an isolated JetStream broker"
run = "sh .scripts/test-message-bus.sh"

[tasks.production-k3d]
description = "Create, render, deploy, inspect, or explicitly delete a production rehearsal"
run = "bash .scripts/production-k3d.sh"
raw_args = true

[tasks.production-smoke]
description = "Run protocol and persistence checks against a guarded local production rehearsal"
run = "bash .scripts/smoke-production-k3d.sh"
raw_args = true

[tasks.production-backup-recovery-k3d]
description = "Run a complete synthetic backup and fresh-target recovery rehearsal in k3d"
run = "bash .scripts/backup-recovery-k3d.sh"
raw_args = true

[tasks.test-auth-ingress]
description = "Verify production ingress token routing and configuration isolation with real Traefik"
env = { TEST_AUTH_INGRESS = "true" }
run = "bats --print-output-on-failure .scripts/tests/traefik-ingress.bats"

[tasks.sync-tailwind]
description = "Generate shared Tailwind sources and Docker build inputs"
file = ".scripts/sync-tailwind.sh"

[tasks.sync-ignore-files]
description = "Regenerate Docker and Prettier ignore files"
file = ".scripts/sync-ignore-files.sh"

[tasks.sync-vscode-settings]
description = "Generate repository VS Code settings"
file = ".scripts/sync-vscode-settings.sh"
sources = [".scripts/sync-vscode-settings.sh", "*/.project.yaml"]
outputs = [".vscode/settings.json"]

[tasks.sync-files]
description = "Validate file layout and synchronize shared generated files"
depends = ["check-forbidden-files"]
run = [
  { tasks = ["sync-tailwind", "sync-ignore-files", "sync-vscode-settings"] },
]

[tasks.sync-devcontainers]
description = "Regenerate devcontainer configuration for selected projects or all projects"
file = ".scripts/sync-devcontainers.sh"

[tasks.generate-bazel-build]
description = "Generate Bazel build rules from project metadata and repository files"
file = ".scripts/generate-bazel-build.sh"

[tasks.sync]
description = "Synchronize shared files, devcontainers, GraphQL schemas and Bazel rules"
depends = [
  "create-intranet",
  "create-search-key",
  "create-auth-test-fixture",
  "create-oauth-secrets",
]
run = [
  { task = "sync-files" },
  { task = "sync-devcontainers" },
  { task = "merge-graphql-schemas" },
  { task = "generate-bazel-build" },
]

[tasks.generate-docker-compose]
description = "Generate the development Compose configuration"
depends = [
  "create-intranet",
  "create-search-key",
  "create-auth-test-fixture",
  "create-oauth-secrets",
  "refresh-render-inputs",
]
sources = [
  "mise.toml",
  ".scripts/generate-docker-compose.sh",
  ".scripts/lib/project-metadata.sh",
  ".scripts/refresh-render-inputs.sh",
  "package.json",
  "*/.project.yaml",
  ".scripts/templates/docker-compose-template.yml",
  ".scripts/templates/oauth2-proxy-alpha-template.yml",
  ".scripts/templates/service-template.lib.yml",
  ".scripts/templates/fixtures-service-template.lib.yml",
  ".scripts/templates/traefik-service-template.lib.yml",
  ".scripts/templates/nats-service-template.lib.yml",
  ".scripts/templates/browse-maintenance-template.lib.yml",
  ".generated/compose-inputs.json",
]
outputs = [
  "docker-compose.yml",
  "oauth2-proxy-alpha.yml",
  ".generated/compose-source-fingerprint"
]
file = ".scripts/generate-docker-compose.sh"

[tasks.refresh-render-inputs]
description = "Refresh effective Compose inputs and source fingerprint"
run = "bash .scripts/refresh-render-inputs.sh"

[tasks.refresh-graphql-inputs]
description = "Refresh effective GraphQL build inputs after Compose generation"
depends = ["generate-docker-compose"]
run = "bash .scripts/refresh-render-inputs.sh graphql"

[tasks.export-graphql-schema]
description = "Build the GraphQL application image and cache its canonical SDL"
depends = ["refresh-graphql-inputs"]
file = ".scripts/export-graphql-schema.sh"
sources = [
  "mise.toml",
  ".scripts/export-graphql-schema.sh",
  ".scripts/refresh-render-inputs.sh",
  "docker-compose.yml",
  "graphql/.project.yaml",
  "graphql/Dockerfile",
  "graphql/.dockerignore",
  "graphql/Cargo.toml",
  "graphql/Cargo.lock",
  "graphql/src/**",
  ".generated/graphql-inputs.json",
]
outputs = [
  ".generated/graphql/recipe-db.graphqls",
  ".generated/graphql-source-fingerprint"
]

[tasks.merge-graphql-schemas]
description = "Distribute the cached GraphQL SDL to metadata-declared consumers"
depends = ["export-graphql-schema"]
file = ".scripts/merge-graphql-schemas.sh"

[tasks.in-devcontainer]
description = "Run a command in a project devcontainer: [--rm | --keep-running] <project> [--rm | --keep-running] <command> [args...]; retention also via DEVCONTAINER_KEEP_RUNNING=true"
file = ".scripts/run-in-devcontainer.sh"
raw_args = true

[tasks.create-intranet]
description = "Create the shared Docker network if it does not exist"
run = "docker network inspect intranet >/dev/null 2>&1 || docker network create intranet"

[tasks.create-search-key]
description = "Create the ignored development Typesense key without replacing an existing key"
file = ".scripts/create-search-key.sh"

[tasks.create-auth-accounts]
description = "Create the ignored development auth accounts file without replacing an existing file"
file = ".scripts/create-auth-accounts.sh"

[tasks.create-auth-test-fixture]
description = "Generate ephemeral isolated GraphQL token principals for E2E auth tests"
file = ".scripts/create-auth-test-fixture.sh"
depends = ["create-auth-accounts"]

[tasks.create-oauth-secrets]
description = "Create private development OAuth placeholders, cookie and ingress secrets without replacing existing files"
file = ".scripts/create-oauth-secrets.sh"

[tasks.seed-demodata]
description = "Generate demo data against the development stack"
file = ".scripts/seed-demodata.sh"

[tasks.dev-up]
description = "Start the development stack detached and wait for readiness; accepts extra Compose up arguments"
depends = ["generate-docker-compose"]
run = "docker compose up -d --wait"
raw_args = true

[tasks.dev-down]
description = "Stop the development stack and remove orphan containers; accepts extra Compose down arguments"
run = "docker compose down --remove-orphans"
raw_args = true

[tasks.start-test-fixtures]
description = "Start the shared integration-test fixture service"
run = "docker compose --profile test up -d fixtures"

[tasks.integration-tests]
description = "Run destructive integration tests against the development stack"
file = ".scripts/run-integration-tests.sh"

[tasks.update-docker-image-digests]
description = "Refresh external Docker image digests from their registries"
file = ".scripts/update-docker-image-digests.sh"
raw_args = true

[settings]
idiomatic_version_file_enable_tools = ["npm", "pnpm"]
task.source_freshness_hash_contents = true
