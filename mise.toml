[tools]
"aqua:bats-core/bats-core" = "1.13.0"
jq = "latest"
node = "26"
"npm:@devcontainers/cli" = "latest"
shellcheck = "latest"
yq = "latest"
ytt = "latest"
"aqua:bazelbuild/bazelisk" = "latest"

[hooks]
postinstall = { task = "setup" }

[tasks.install-deps]
run = "pnpm install --frozen-lockfile"

[tasks.install-precommit]
run = "printf '%s\\n' '#!/bin/sh' 'exec bash .scripts/precommit.sh \"$@\"' > .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit"

[tasks.setup]
run = [
  "mise run install-deps",
  "mise run install-precommit",
  "mise run sync",
  "mise run generate-docker-compose prepare",
]

[tasks.check-forbidden-files]
run = "sh .scripts/check-forbidden-files.sh"

[tasks.test-scripts]
description = "Run repository script regression tests with Bats"
run = "mise exec -- bats --print-output-on-failure .scripts/tests"

[tasks.sync-tailwind]
run = "sh .scripts/sync-tailwind.sh"

[tasks.sync-ignore-files]
run = "sh .scripts/sync-ignore-files.sh"

[tasks.sync-vscode-settings]
run = "sh .scripts/sync-vscode-settings.sh"

[tasks.sync-files]
run = [
  "mise run check-forbidden-files",
  "mise run --jobs 3 sync-tailwind ::: sync-ignore-files ::: sync-vscode-settings",
]

[tasks.sync-devcontainers]
run = "sh .scripts/sync-devcontainers.sh"

[tasks.generate-bazel-build]
run = "bash .scripts/generate-bazel-build.sh"

[tasks.sync]
run = [
  "mise run create-intranet",
  "mise run sync-files",
  "mise run sync-devcontainers",
  "mise run merge-graphql-schemas",
  "mise run generate-bazel-build",
]

[tasks.generate-docker-compose]
run = "sh .scripts/generate-docker-compose.sh"

[tasks.merge-graphql-schemas]
run = "sh .scripts/merge-graphql-schemas.sh"

[tasks.in-devcontainer]
run = "sh .scripts/run-in-devcontainer.sh"

[tasks.create-intranet]
run = "docker network inspect intranet >/dev/null 2>&1 || docker network create intranet"

[tasks.seed-demodata]
run = "docker compose --profile development run --build --rm -e FORCE_DELETE demo-data"

[tasks.start-test-fixtures]
run = "docker compose --profile test up -d fixtures"

[tasks.integration-tests]
run = "bash .scripts/run-integration-tests.sh"

[tasks.update-docker-image-digests]
run = "sh .scripts/update-docker-image-digests.sh"

[settings]
idiomatic_version_file_enable_tools = ["npm", "pnpm"]
