# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-ratings
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - build-essential
      - git
      - cmake
      - wget
      - libsqlite3-dev
      - libpcre2-dev
      - libevent-dev
      - libmarkdown2-dev
    args:
      IO_VERSION: 8d1566b5edf8f378618fc7739518d7a5c56de654
      PCRE_VERSION: "8.45"
    root:
      - RUN git clone --branch native --recursive https://github.com/IoLanguage/io.git /tmp/io
        && cd /tmp/io && git checkout $IO_VERSION
        && mkdir build && cd build
        && cmake -DCMAKE_BUILD_TYPE=release -DCMAKE_INSTALL_PREFIX=/usr/local ..
        && make && make install
      - RUN chown -R vscode:vscode /tmp/io
      # trixie dropped the PCRE1 dev package; the Io Regex addon still uses the old
      # pcre.h API, so build it from source
      - RUN wget -q https://sourceforge.net/projects/pcre/files/pcre/$PCRE_VERSION/pcre-$PCRE_VERSION.tar.gz/download -O /tmp/pcre.tar.gz
        && tar -xzf /tmp/pcre.tar.gz -C /tmp
        && cd /tmp/pcre-$PCRE_VERSION && ./configure --prefix=/usr/local && make && make install
        && ldconfig
      # eerie's docio dependency pulls in IoLanguage/Markdown, whose source assumes an
      # older discount API; patch it and redirect git clones to the patched copy
      - RUN git clone https://github.com/IoLanguage/Markdown.git /opt/Markdown-patched
        && sed -i 's/mkd_flag_t \*flags/mkd_flag_t flags/' /opt/Markdown-patched/source/IoMarkdown.c
        && git -C /opt/Markdown-patched -c user.email=devcontainer@example.com -c user.name=devcontainer
        commit -am "patch for discount 2.2 mkd_flag_t API"
        && chown -R vscode:vscode /opt/Markdown-patched
        && git config --system url."file:///opt/Markdown-patched".insteadOf "https://github.com/IoLanguage/Markdown.git"
    user:
      - ENV LD_LIBRARY_PATH=/usr/local/lib
      - ENV EERIEDIR="${HOME}/.eerie"
      - ENV PATH="${PATH}:${HOME}/.eerie/base/bin"
      - RUN cd /tmp/io/build && io setup.io
      - RUN cd $HOME && eerie install https://github.com/IoLanguage/Regex.git
      - RUN cd $HOME && eerie install https://github.com/IoLanguage/Socket.git
      - RUN cd $HOME && eerie install https://github.com/IoLanguage/CGI.git
      - RUN cd $HOME && eerie install https://github.com/IoLanguage/SQLite3.git
  ports:
    - 8456
  environment:
    TESTING: "true"
vscode:
  settings:
    peacock.remoteColor: "#db94db"
  extensions:
    - johnpapa.vscode-peacock
    - qwtel.sqlite-viewer
extras:
  - traefik
traefik:
  network: intranet
  labels:
    http:
      services:
        recipe-db-ratings:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        ratings:
          rule: PathPrefix(`/ratings`)
          entrypoints: rest-internal
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: backend
prettier:
  ignore:
    - "*.io"
precommit: io --version
