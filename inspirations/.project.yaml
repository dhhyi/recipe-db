# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://lua
devcontainer:
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-inspirations
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    user:
      - RUN mise use -g lua@5.4
    packages:
      - m4
      - libssl-dev
    files:
      - type: file
        path: ~/.config/fish/conf.d/lua_modules.fish
        content: |
          #!/usr/bin/env fish
          # Add lua_modules to PATH using luarocks
          if test -d lua_modules
              eval (luarocks path --tree lua_modules --shell fish 2>/dev/null || echo)
          end
  ports:
    - 8800
  environment:
    TESTING: "true"
  initialize: |
    luarocks make --tree lua_modules
    luarocks install https://raw.githubusercontent.com/dhhyi/Milua/main/milua-0.1-1.rockspec --tree lua_modules
    luarocks install --server=https://luarocks.org/dev luaformatter --tree lua_modules
    luarocks install luacheck --tree lua_modules
  instantiate: |
    mkdir -p ~/.config/fish/conf.d
vscode:
  settings:
    Lua.format.enable: false
    peacock.remoteColor: "#1db8e8"
  extensions:
    - johnpapa.vscode-peacock
extras:
  - traefik
  - named-volumes
namedVolumes:
  lua_modules: recipe-db-inspirations-lua-modules
traefik:
  network: intranet
  labels:
    http:
      services:
        recipe-db-inspirations:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        inspirations:
          rule: PathPrefix(`/inspirations`)
          entrypoints: rest-internal
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: backend
prettier:
  ignore:
    - "*.lua"
    - "*.rockspec"
precommit: |
  eval "$(luarocks path --tree lua_modules)"
  lua -v
  lua-format *.lua -i
  lua-format *.rockspec -i --column-table-limit=1
  luacheck *.lua
