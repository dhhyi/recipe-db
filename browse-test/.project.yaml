# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-browse-test
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-browse-test
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    args:
      CHROME_VERSION: "155.0.8059.84"
    root:
      - RUN apt-get update -o Dir::Etc::sourcelist=sources.list.d/debian.sources -o Dir::Etc::sourceparts=- && apt-get install -y --no-install-recommends chromium libatomic1 fonts-noto-color-emoji unzip && apt-get clean && rm -rf /var/lib/apt/lists/*
      - RUN sh -c 'if [ "$(dpkg --print-architecture)" = amd64 ]; then curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" -o /tmp/chrome.zip && unzip -q /tmp/chrome.zip -d /opt/google && mv /opt/google/chrome-linux64 /opt/google/chrome && rm /tmp/chrome.zip; fi'
    user:
      - RUN mise use -g node@26
      - RUN npm install -g pnpm@12.6.0
  environment:
    MISE_IGNORED_CONFIG_PATHS: "/workspaces/*/mise.toml"
    BASE_URL: http://traefik
    REST_API: http://traefik:3000
  initialize: |
    if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#a3c95d"
  extensions:
    - johnpapa.vscode-peacock
    - ms-playwright.playwright
  tasks:
    - label: Run browser tests
      command: pnpm test
extras:
  - traefik
traefik:
  network: intranet
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: test
dockerContext: "."
check: |
  node --check playwright.config.js
  node --check tests/recipes.spec.js
  node --check tests/fixtures.js
  pnpm exec playwright test --list --reporter=list
test: pnpm test
