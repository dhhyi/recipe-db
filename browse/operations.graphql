fragment Rating on Rating {
  recipeId
  average
  count
}

fragment RecipeStub on Recipe {
  id
  name
  tags {
    ...RecipeTag
  }
  image {
    url
    thumbUrl
  }
  rating {
    ...Rating
  }
}

fragment RecipeTag on Tag {
  id
  category
  name
}

query Overview {
  recipes {
    ...RecipeStub
  }
  ratingsOnline: isServiceOnline(name: "ratings")
}

query BrowseServices {
  searchOnline: isServiceOnline(name: "search")
  ratingsOnline: isServiceOnline(name: "ratings")
}

query BrowseControls {
  myCapabilities {
    role
    canManageRecipes
    canManageImages
  }
  recipeEditOnline: isServiceOnline(name: "recipes-edit")
}

query BrowseIdentity {
  myCapabilities {
    role
  }
}

query RatingCapabilities($id: ID!) {
  myCapabilities {
    role
    canRate
  }
  rating(id: $id) {
    ...Rating
  }
}

query BrowseSearch($options: JSON!) {
  searchRecipes(options: $options) {
    recipes {
      ...RecipeStub
    }
    found
    page
    perPage
  }
}

fragment RecipeDetail on Recipe {
  id
  name
  updatedAt
  method
  tags {
    ...RecipeTag
  }
  image {
    url
    thumbUrl
  }
  ingredients {
    name
    amount
    unit
    optional
  }
  rating {
    ...Rating
  }
}

query RecipeById($id: ID!) {
  recipe(id: $id) {
    ...RecipeDetail
  }
}

query RecipeTags($id: ID!) {
  myCapabilities {
    role
    canManageRecipes
  }
  recipe(id: $id) {
    id
    tags {
      ...RecipeTag
    }
  }
}

query TagInventory {
  tags {
    ...RecipeTag
  }
}

mutation AddRecipeTag($recipeId: ID!, $tagId: ID!) {
  addRecipeTag(recipeId: $recipeId, tagId: $tagId)
}

mutation RemoveRecipeTag($recipeId: ID!, $tagId: ID!) {
  removeRecipeTag(recipeId: $recipeId, tagId: $tagId)
}

query SimilarRecipeIds($recipeId: ID!) {
  similarRecipeIds(recipeId: $recipeId)
}

query SimilarRecipeCard($id: ID!) {
  recipe(id: $id) {
    ...RecipeStub
  }
}

query RecipeControls {
  myCapabilities {
    role
    canManageRecipes
    canManageImages
  }
  recipeEditOnline: isServiceOnline(name: "recipes-edit")
  imagesOnline: isServiceOnline(name: "images")
  imageEditOnline: isServiceOnline(name: "images-edit")
}

query RecipeRating($id: ID!) {
  myCapabilities {
    role
    canRate
  }
  recipe(id: $id) {
    id
    rating {
      ...Rating
      myRating
    }
  }
}

fragment InspirationsLink on Link {
  url
  extracted {
    title
    description
    canonical
    inlinedFavicon
  }
}

query RecipeInspirations($id: ID!) {
  recipe(id: $id) {
    id
    inspirations {
      ...InspirationsLink
    }
  }
  inspirationsOnline: isServiceOnline(name: "inspirations")
}

mutation RateRecipe($id: ID!, $rating: Int!) {
  rate(id: $id, rating: $rating) {
    ...Rating
    myRating
  }
}
