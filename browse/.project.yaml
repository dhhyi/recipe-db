# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-frontend
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-frontend
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - build-essential
    user:
      - RUN mise use -g go@1.25 watchexec
      - RUN go install github.com/a-h/templ/cmd/templ@latest
      - RUN go install golang.org/x/tools/gopls@latest
  ports:
    - 3000
  environment:
    MISE_IGNORED_CONFIG_PATHS: "/workspaces/*/mise.toml"
    NATS_URL: "nats://nats:4222"
  initialize: |
    go mod download -x
    templ generate
    go run github.com/Khan/genqlient@main
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#b8db94"
    "[templ]":
      editor.defaultFormatter: a-h.templ
    emmet.includeLanguages:
      templ: html
    tailwindCSS.includeLanguages:
      templ: html
    tailwindCSS.experimental.configFile: ../design/src/design.css
    runOnSave.commands:
      - match: '(\.graphqls?|genqlient.yaml)$'
        command: cd ${workspaceFolder} && go run github.com/Khan/genqlient@main
        runningStatusMessage: "genqlient..."
        finishStatusMessage: "genqlient ✔"
      - match: "\\.templ$"
        command: cd ${workspaceFolder} && templ generate
        runningStatusMessage: "templ..."
        finishStatusMessage: "templ ✔"
  extensions:
    - johnpapa.vscode-peacock
    - pucelle.run-on-save
    - golang.Go
    - a-h.templ
    - GraphQL.vscode-graphql
    - bradlc.vscode-tailwindcss
  tasks:
    - label: Run watch server
      command: watchexec -r -e go --ignore-nothing -- go run .
extras:
  - traefik
  - named-volumes
namedVolumes:
  $HOME/go/pkg/mod/cache: recipe-db-frontend-go-cache
traefik:
  network: intranet
  labels:
    http:
      services:
        recipe-db-frontend:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        frontend:
          rule: PathPrefix(`/`)
          entrypoints: web
          priority: 2
          middlewares: frontend-compress,browse-unavailable
      middlewares:
        frontend-compress:
          compress: true
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: frontend
graphqlSchema: "."
tailwindSources:
  - src
generate:
  - command: go run github.com/Khan/genqlient@main
    output: src/generated/graphql.go
  - command: templ generate
    output: src/**/*_templ.go
format:
  check: format-check-copy $format_apply $argv
  apply: gofmt -w $argv
  files: ["**/*.go"]
check: |
  go version
  go vet ./...
  env CGO_ENABLED=1 go test -race ./...
  go build -o main
  stat main
test: env CGO_ENABLED=1 go test -race ./...
prettier:
  ignore:
    - go.mod
    - go.sum
    - "*.go"
    - "*.templ"
