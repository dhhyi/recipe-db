#:schema https://mise.jdx.dev/schema/mise-task.json

[sync-devcontainers]
description = "Synchronize all devcontainers, skipping projects already in sync"
depends = ["sync-devcontainer:*"]

["sync-devcontainer:browse"]
description = "Synchronize the browse devcontainer"
shell = "bash -o pipefail -c"
run = "curl -fsSL https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/bundle.js | node - browse/.project.yaml browse"
sources = ["browse/.project.yaml"]
outputs = [
  "browse/.devcontainer/devcontainer.json",
  "browse/.devcontainer/Dockerfile",
  "browse/.vscode/tasks.json",
  "browse/.update_devcontainer.sh",
]

