[pi-kubernetes-tunnel]
description = "Open a foreground SSH tunnel to the Pi Kubernetes API"
raw = true
run = 'ssh -i "$HOME/.config/recipe-db/ssh/recipe-db-pi" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.config/recipe-db/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ExitOnForwardFailure=yes -N -L 127.0.0.1:6445:127.0.0.1:6443 piadmin@recipe-pi.home'

[pi-ssh]
description = "Open an interactive SSH session to the Pi"
raw = true
run = 'ssh -i "$HOME/.config/recipe-db/ssh/recipe-db-pi" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.config/recipe-db/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null piadmin@recipe-pi.home'
