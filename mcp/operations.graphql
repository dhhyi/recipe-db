mutation CreateRecipe($value: RecipeInput!) {
  createRecipe(value: $value) {
    id
    name
  }
}

mutation UpdateRecipe($id: ID!, $value: RecipeInput!) {
  updateRecipe(id: $id, value: $value) {
    id
    name
  }
}

mutation SetImage($recipeId: ID!, $file: Upload!) {
  setImage(recipeId: $recipeId, file: $file) {
    url
    thumbUrl
    width
    height
    size
  }
}

mutation Rate($id: ID!, $rating: Int!) {
  rate(id: $id, rating: $rating) {
    average
    count
  }
}

query OnlineServices {
  onlineServices
}

query ListRecipes {
  recipes {
    id
    name
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    id
    name
    method
    ingredients {
      name
      amount
      unit
      optional
    }
    rating {
      average
      count
    }
    image {
      url
      thumbUrl
      width
      height
      size
    }
    inspirations {
      url
    }
    tags {
      id
      category
      name
    }
  }
}

query ListTags($category: TagCategory) {
  tags(category: $category) {
    id
    category
    name
  }
}

mutation CreateTag($category: TagCategory!, $name: String!) {
  createTag(category: $category, name: $name) {
    id
    category
    name
  }
}

mutation DeleteTag($id: ID!) {
  deleteTag(id: $id)
}

mutation ChangeRecipeTags(
  $recipeId: ID!
  $addTagIds: [ID!]
  $removeTagIds: [ID!]
) {
  changeRecipeTags(
    recipeId: $recipeId
    addTagIds: $addTagIds
    removeTagIds: $removeTagIds
  ) {
    id
    category
    name
  }
}
