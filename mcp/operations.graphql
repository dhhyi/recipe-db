mutation CreateRecipe($value: RecipeInput!) {
  createRecipe(value: $value) {
    id
    name
  }
}

mutation UpdateRecipe($id: ID!, $value: RecipeInput!) {
  updateRecipe(id: $id, value: $value) {
    id
    name
  }
}

mutation SetImage($recipeId: ID!, $file: Upload!) {
  setImage(recipeId: $recipeId, file: $file)
}

mutation Rate($id: ID!, $rating: Int!, $login: String!) {
  rate(id: $id, rating: $rating, login: $login) {
    average
    count
  }
}

query OnlineServices {
  onlineServices
}

query ListRecipes {
  recipes {
    id
    name
  }
}

query GetRecipe($id: ID!) {
  recipe(id: $id) {
    id
    name
    method
    ingredients {
      name
      amount
      unit
      optional
    }
    rating {
      average
      count
    }
    image {
      url
      thumbUrl
      width
      height
      size
    }
    inspirations {
      url
    }
  }
}
