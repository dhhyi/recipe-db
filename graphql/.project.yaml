# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-graphql
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-graphql
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - build-essential
      - pkg-config
      - libssl-dev
      - musl-tools
    user:
      - RUN mise use -g watchexec
      - RUN mise use -g rust@1.98.0
      - RUN rustup target add x86_64-unknown-linux-musl
  initialize: cargo fetch
  ports:
    - 4000
  environment:
    REST_ENDPOINT: http://traefik:3000
    TRAEFIK_ENTRYPOINTS: web,rest-internal
    NATS_URL: nats://nats:4222
    MISE_IGNORED_CONFIG_PATHS: "/workspaces/*/mise.toml"
    AUTH_TRUSTED_ISSUER: https://accounts.google.com
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#dbdb94"
    "[rust]":
      editor.defaultFormatter: rust-lang.rust-analyzer
  extensions:
    - johnpapa.vscode-peacock
    - rust-lang.rust-analyzer
    - GraphQL.vscode-graphql
  tasks:
    - label: Run watch server
      command: sudo install -D -o root -g root -m 0444 ../.secrets/auth-accounts.json /run/secrets/auth-accounts.json && watchexec -r -e rs,toml,lock -- cargo run
extras:
  - named-volumes
  - traefik
namedVolumes:
  $HOME/.cargo/registry: recipe-db-graphql-cargo-registry
  $HOME/.cargo/git: recipe-db-graphql-cargo-git
  target: recipe-db-graphql-target
traefik:
  network: intranet
  labels:
    http:
      services:
        recipe-db-graphql:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        graphql-anonymous:
          rule: PathPrefix(`/graphql`)
          entrypoints: web
          priority: 100
        graphql-cookie:
          rule: "PathPrefix(`/graphql`) && HeaderRegexp(`Cookie`, `(^|;\\s*)_oauth2_proxy(_[^=;\\s]*)?(=|;|\\s|$)`)"
          entrypoints: web
          priority: 200
          middlewares: oauth2-forward-auth
        graphql-bearer:
          rule: "PathPrefix(`/graphql`) && HeaderRegexp(`Authorization`, `.*`)"
          entrypoints: web
          priority: 300
      middlewares:
        oauth2-forward-auth:
          forwardAuth:
            address: http://oauth2-proxy:4180/oauth2/auth
            trustForwardHeader: false
            authRequestHeaders:
              - Cookie
              - Authorization
            authResponseHeaders:
              - X-Auth-Request-User
              - X-Auth-Request-Issuer
              - X-Auth-Request-Email
              - X-Auth-Request-Email-Verified
            addAuthCookiesToResponse:
              - _oauth2_proxy
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: api
format: cargo fmt
check: |
  cargo --version
  cargo clippy --all-targets -- -D warnings
  cargo test
  cargo build --release
prettier:
  ignore:
    - "*.rs"
    - Cargo.lock
