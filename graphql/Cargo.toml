[package]
name = "graphql"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "graphql"
path = "src/main.rs"

[dependencies]
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# no TLS features: every REST backend is reached via plain HTTP inside the intranet
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
