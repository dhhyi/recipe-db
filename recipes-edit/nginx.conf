server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/stderr warn;

    location /js/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 204;
    }

}