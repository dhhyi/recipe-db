# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-recipes-edit
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-recipes-edit
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - nginx
      - libatomic1
    args:
      NGINX_FORMATTER_VERSION: "2.3.0"
    root:
      - ADD https://github.com/soulteary/nginx-formatter/releases/download/v${NGINX_FORMATTER_VERSION}/nginx-formatter_${NGINX_FORMATTER_VERSION}_linux_amd64.tar.gz /tmp/nginx-formatter.tar.gz
      - RUN tar -xvf /tmp/nginx-formatter.tar.gz -C /tmp
        && mv /tmp/nginx-formatter /usr/local/bin/nginx-formatter
      - RUN rm -rf /etc/nginx/sites-enabled/default && chmod -R 777 /usr/share/nginx/html
    user:
      - RUN mise use -g java@21
      - RUN mise use -g clojure@1.12.3.1577
      # mise's aqua registry cannot resolve pnpm assets, so use the npm backend
      - RUN mise use -g node@26 npm:pnpm@11
    files:
      - type: script
        path: /usr/local/bin/distribute-js
        content: |
          #!/bin/sh
          [ -z "$1" ] && echo "No argument supplied" && exit 1
          echo "Distributing $1/* to /usr/share/nginx/html/"
          cp -Rf "$1"/* /usr/share/nginx/html/
          sudo /etc/init.d/nginx restart
  ports:
    - 80
  initialize: |
    sudo ln -sf ${containerWorkspaceFolder}/nginx.conf /etc/nginx/conf.d/default.conf
    sudo ln -sf ${containerWorkspaceFolder}/index.html /usr/share/nginx/html/index.html
    sudo /etc/init.d/nginx start
    cd ${containerWorkspaceFolder}
    pnpm install
    pnpm build
    distribute-js public
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#b894db"
    "[clojure]":
      editor.defaultFormatter: betterthantomorrow.calva
    tailwindCSS.includeLanguages:
      clojure: html
    tailwindCSS.experimental.configFile: ../design/src/design.css
    runOnSave.commands:
      - languages: ["clojure", "graphql"]
        command: cd ${workspaceFolder} && pnpm build && distribute-js public
        runningStatusMessage: "clojure..."
        finishStatusMessage: "clojure ✔"
      - match: "nginx.conf"
        command: sudo /etc/init.d/nginx reload
        runningStatusMessage: "nginx..."
        finishStatusMessage: "nginx ✔"
  extensions:
    - johnpapa.vscode-peacock
    - betterthantomorrow.calva
    - pucelle.run-on-save
    - GraphQL.vscode-graphql
    - bradlc.vscode-tailwindcss
  tasks:
    - label: Run watch server
      command: pnpm watch
extras:
  - traefik
  - named-volumes
namedVolumes:
  $HOME/.m2: recipe-db-recipes-edit-m2
  $HOME/.gitlibs: recipe-db-recipes-edit-gitlibs
  .pnpm-store: recipe-db-recipes-edit-pnpm-store
  node_modules: recipe-db-recipes-edit-node-modules
  target: recipe-db-recipes-edit-target
traefik:
  network: intranet
  labels:
    http:
      middlewares:
        recipes-edit-strip:
          stripPrefix:
            prefixes: /edit
      services:
        recipe-db-recipes-edit:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        recipes-edit:
          rule: PathPrefix(`/edit`)
          entrypoints: web
          middlewares: recipes-edit-strip
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: frontend
graphqlSchema: "."
tailwindSources:
  - index.html
  - src
precommit: |
  java --version
  clojure --version
  npx prettier --write index.html package.json pnpm-workspace.yaml
  nginx-formatter -indent=4
  clojure -M:format fix src deps.edn shadow-cljs.edn
  clojure -M:lint --lint src
  pnpm test
  pnpm build
prettier:
  ignore:
    - "*.clj"
    - "*.cljc"
    - "*.cljs"
    - "*.edn"
    - nginx.conf
