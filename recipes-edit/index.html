<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/design/styles.css" />
    <script type="module" src="/design/components.js"></script>
    <title>Rezept bearbeiten | RezeptDB</title>
  </head>
  <body class="container">
    <header-component></header-component>
    <main id="app" class="recipe-editor"></main>
    <footer-component></footer-component>
    <script src="/edit/js/main.js"></script>
    <script>
      fetch("/identity", { cache: "no-store" })
        .then((response) => (response.ok ? response.text() : ""))
        .then((markup) => {
          if (!markup) return;
          const identity = new DOMParser()
            .parseFromString(markup, "text/html")
            .querySelector("header-component");
          const header = document.querySelector("header-component");
          if (!identity || !header) return;
          for (const attribute of ["auth-role", "auth-name", "auth-enabled"]) {
            if (identity.hasAttribute(attribute)) {
              header.setAttribute(attribute, identity.getAttribute(attribute));
            } else {
              header.removeAttribute(attribute);
            }
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
