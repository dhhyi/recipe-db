# OAuth2 Proxy v7.15.5 options not covered by the alpha configuration.
# Durations are deliberately short so expiry and refresh are deterministic in tests.
reverse_proxy = true
trusted_proxy_ips = ["10.231.65.0/24"]
email_domains = ["*"]
redirect_url = "http://app.poc.test/oauth2/callback"
whitelist_domains = ["app.poc.test"]
skip_provider_button = true

# Baseline experiment only: anonymous access granted by OAuth2 Proxy.
skip_auth_routes = ["^/baseline/graphql$"]

cookie_name = "_oauth2_proxy"
cookie_secret_file = "/run/secrets/cookie-secret"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "60s"
cookie_refresh = "20s"
cookie_csrf_per_request = true
cookie_csrf_expire = "5m"

session_store_type = "redis"
redis_connection_url = "redis://redis:6379"
