# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-demo-data
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-demo-data
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - nodejs
      - npm
      # mise's python@3.13 currently fails to build on dcc://debian, use the apt package instead
      - python3
      - python3-pip
    root:
      - RUN npm install -g cspell@6 @cspell/dict-de-de && cspell link add @cspell/dict-de-de
    user:
      - RUN pip install ariadne-codegen black pylint --break-system-packages
      - ENV PATH="${HOME}/.local/bin:${PATH}"
  initialize: ariadne-codegen
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#dbb894"
    python.formatting.provider: none
    "[python]":
      editor.defaultFormatter: ms-python.black-formatter
    runOnSave.commands:
      - match: "\\.graphql"
        command: cd ${workspaceFolder} && ariadne-codegen
        runningStatusMessage: "codegen..."
        finishStatusMessage: "codegen ✔"
    cSpell.language: de-de
    cSpell.enabledLanguageIds: ["json", "markdown"]
  extensions:
    - johnpapa.vscode-peacock
    - GraphQL.vscode-graphql
    - pucelle.run-on-save
    - ms-python.black-formatter
    - streetsidesoftware.code-spell-checker
    - streetsidesoftware.code-spell-checker-german
extras:
  - traefik
traefik:
  network: intranet
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: development
graphqlSchema: "."
precommit: |
  python3 --version
  cspell --locale de-de recipe*.{json,md}
  ariadne-codegen
  black ./*.py
  pylint ./*.py
prettier:
  ignore:
    - "*.py"
    - "*.pyc"
    - .pylintrc
    - "*.toml"
    - "*.jpg"
