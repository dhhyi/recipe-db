query AllServicesUp($names: [String!]!) {
  allServicesOnline(names: $names)
}

query Recipes {
  recipes {
    id
  }
}

mutation DeleteRecipe($id: ID!) {
  deleteRecipe(id: $id)
}

mutation AddRecipe($value: RecipeInput!) {
  createRecipe(value: $value) {
    id
    name
  }
}

mutation AddRating($id: ID!, $rating: Int!) {
  rate(id: $id, rating: $rating) {
    average
    count
  }
}

mutation AddImage($id: ID!, $file: Upload!) {
  setImage(recipeId: $id, file: $file) {
    url
  }
}

query DemoTagInventory {
  tags {
    id
    category
    name
  }
}

mutation DemoCreateTag($category: TagCategory!, $name: String!) {
  createTag(category: $category, name: $name) {
    id
    category
    name
  }
}

mutation DemoAssignRecipeTags($recipeId: ID!, $addTagIds: [ID!]) {
  changeRecipeTags(recipeId: $recipeId, addTagIds: $addTagIds) {
    id
  }
}
