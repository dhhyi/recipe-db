server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        return 204;
    }

    location = /pwa/manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /pwa/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
