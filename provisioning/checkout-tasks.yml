- name: Validate the immutable checkout revision
  ansible.builtin.assert:
    that:
      - checkout_revision is match('^[0-9a-f]{40}$')
    fail_msg: Supply the full immutable checkout revision.

- name: Refuse changing a checkout used by an active command or another operation
  ansible.builtin.script:
    cmd: >-
      files/checkout-guard.py --revision {{ checkout_revision | quote }} --maintenance-holder {{ checkout_maintenance_holder | default('') | quote }}
    executable: /usr/bin/python3
  changed_when: false

- name: Install the lock-guarded Git executable used only by checkout maintenance
  ansible.builtin.copy:
    src: files/checkout-guard.py
    dest: /usr/local/sbin/recipe-db-checkout-git
    owner: root
    group: root
    mode: "0700"

- name: Check out the explicitly selected immutable backup capture release
  ansible.builtin.git:
    repo: https://github.com/dhhyi/recipe-db.git
    dest: /opt/recipe-db
    version: "{{ checkout_revision }}"
    force: false
    recursive: false
    executable: /usr/local/sbin/recipe-db-checkout-git
  environment:
    RECIPE_DB_CHECKOUT_REVISION: "{{ checkout_revision }}"
    RECIPE_DB_CHECKOUT_HOLDER: "{{ checkout_maintenance_holder | default('') }}"
