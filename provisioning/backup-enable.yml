- name: Explicitly enable scheduled backups after acceptance
  hosts: pi
  gather_facts: false
  become: true
  tasks:
    - name: Check backup capture status without displaying private details
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/recipe-db-backup-upload
          - status
          - --config
          - /etc/recipe-db/backup.json
      register: backup_status
      changed_when: false
      no_log: true

    - name: Inspect cluster operation ownership before enabling the timer
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - /etc/recipe-db/backup-kubeconfig.yaml
          - --namespace
          - kube-system
          - get
          - lease
          - recipe-db-deploy
          - --ignore-not-found
          - -o
          - json
      register: backup_enable_lease
      changed_when: false
      no_log: true

    - name: Refuse scheduling while cluster operation ownership is retained
      ansible.builtin.assert:
        that:
          - backup_enable_lease.stdout | trim | length == 0
        fail_msg: >-
          A cluster operation still owns the Pi. Complete or recover its ownership before enabling scheduled backups. Restore capture status: {{ ((backup_status.stdout | from_json).get('restoreCapture') or {}).get('status', 'unavailable') }}, phase: {{ ((backup_status.stdout | from_json).get('restoreCapture') or {}).get('phase', 'unavailable') }}.

    - name: Generate a unique schedule enablement holder
      ansible.builtin.command: cat /proc/sys/kernel/random/uuid
      register: backup_enable_uuid
      changed_when: false

    - name: Enable scheduling under exclusive cluster ownership
      block:
        - name: Claim cluster operation ownership for schedule enablement
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - --kubeconfig
              - /etc/recipe-db/backup-kubeconfig.yaml
              - --namespace
              - kube-system
              - create
              - -f
              - "-"
              - -o
              - json
            stdin: "{{ {'apiVersion': 'coordination.k8s.io/v1', 'kind': 'Lease', 'metadata': {'name': 'recipe-db-deploy', 'namespace': 'kube-system', 'labels': {'app.kubernetes.io/part-of': 'recipe-db'}, 'annotations': {'recipe-db/operation': 'backup-enable', 'recipe-db/phase': 'acquired'}}, 'spec': {'holderIdentity': 'backup-enable-' ~ (backup_enable_uuid.stdout | trim)}} | to_json }}"
          register: backup_enable_claim
          no_log: true

        - name: Verify the schedule enablement Lease identity
          ansible.builtin.assert:
            that:
              - (backup_enable_claim.stdout | from_json).metadata.name == 'recipe-db-deploy'
              - (backup_enable_claim.stdout | from_json).metadata.namespace == 'kube-system'
              - (backup_enable_claim.stdout | from_json).metadata.uid | length > 0
              - (backup_enable_claim.stdout | from_json).metadata.resourceVersion | length > 0
              - (backup_enable_claim.stdout | from_json).spec.holderIdentity == 'backup-enable-' ~ (backup_enable_uuid.stdout | trim)
          no_log: true

        - name: Recheck backup capture status under cluster ownership
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/recipe-db-backup-upload
              - status
              - --config
              - /etc/recipe-db/backup.json
          register: backup_status
          changed_when: false
          no_log: true

        - name: Read the private backup configuration generation marker
          ansible.builtin.slurp:
            src: /etc/recipe-db/backup-configured-at
          register: backup_configuration_timestamp
          no_log: true

        - name: Require a verified explicit capture before enabling the timer
          ansible.builtin.assert:
            that:
              - (backup_status.stdout | from_json).status in ['verified-upload', 'verified-unchanged']
              - not ((backup_status.stdout | from_json).maintenanceActive | default(false))
              - (backup_status.stdout | from_json).lastCheck is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+]00:00$')
              - (backup_configuration_timestamp.content | b64decode | trim) is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+]00:00$')
              - (backup_status.stdout | from_json).lastCheck > (backup_configuration_timestamp.content | b64decode | trim)
            fail_msg: Run and verify an explicit backup capture before enabling the timer.
          no_log: true

        - name: Enable the scheduled backup timer
          ansible.builtin.systemd_service:
            name: recipe-db-backup.timer
            daemon_reload: true
            enabled: true
            state: started
      rescue:
        - name: Disable the timer after an unsuccessful enablement
          ansible.builtin.systemd_service:
            name: recipe-db-backup.timer
            enabled: false
            state: stopped
          register: backup_enable_rollback
          when: backup_enable_claim.rc | default(1) == 0

        - name: Report unsuccessful schedule enablement
          ansible.builtin.fail:
            msg: Scheduled backup enablement failed; inspect ownership and backup status before retrying.
      always:
        - name: Release only the acquired schedule enablement Lease
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - --kubeconfig
              - /etc/recipe-db/backup-kubeconfig.yaml
              - --namespace
              - kube-system
              - delete
              - --raw
              - /apis/coordination.k8s.io/v1/namespaces/kube-system/leases/recipe-db-deploy
              - -f
              - "-"
            stdin: "{{ {'apiVersion': 'v1', 'kind': 'DeleteOptions', 'preconditions': {'uid': (backup_enable_claim.stdout | from_json).metadata.uid, 'resourceVersion': (backup_enable_claim.stdout | from_json).metadata.resourceVersion}} | to_json }}"
          when:
            - backup_enable_claim.rc | default(1) == 0
            - not (backup_enable_rollback.failed | default(false))
          no_log: true
