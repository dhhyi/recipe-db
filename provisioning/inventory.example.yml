all:
  children:
    pi:
      hosts:
        recipe-db-pi:
          ansible_host: recipe-pi.home
          ansible_user: piadmin
          operator_config_directory: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/recipe-db"
          operator_ssh_private_key: ssh/recipe-db-pi
          ansible_ssh_private_key_file: "{{ operator_ssh_private_key | operator_config_path(operator_config_directory) }}"
          expected_root_uuid: REPLACE-WITH-VERIFIED-ROOT-UUID
          # Set to the reviewed 40-character tooling commit to manage /opt/recipe-db.
          # backup_capture_revision: REPLACE-WITH-REVIEWED-TOOLING-COMMIT
          # Include the workstation's source subnet, not a public/all-address range.
          admin_networks:
            - 192.168.1.0/24
          application_networks:
            - 192.168.1.0/24
