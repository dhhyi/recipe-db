- name: Require an idle backup service before changing capture tools
  ansible.builtin.command: systemctl show --property=ActiveState --value recipe-db-backup.service
  register: backup_service_active
  changed_when: false
  failed_when: >-
    backup_service_active.rc != 0 or backup_service_active.stdout not in ['inactive', 'failed']

- name: Check whether backup configuration is installed
  ansible.builtin.stat:
    path: /etc/recipe-db/backup.json
  register: backup_configuration

- name: Inspect lifecycle state before changing the capture checkout
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/recipe-db-backup-upload
      - status
      - --config
      - /etc/recipe-db/backup.json
  register: backup_lifecycle_status
  changed_when: false
  when: backup_configuration.stat.exists
  no_log: true

- name: Refuse capture checkout changes during release maintenance
  ansible.builtin.assert:
    that:
      - not ((backup_lifecycle_status.stdout | from_json).maintenanceActive | default(false)) or backup_alignment is defined
    fail_msg: Resolve retained maintenance or explicitly align its accepted candidate.
  when: backup_configuration.stat.exists
  no_log: true

- name: Validate explicit accepted-release alignment inputs
  ansible.builtin.assert:
    that:
      - backup_configuration.stat.exists
      - (backup_lifecycle_status.stdout | from_json).maintenanceActive
      - backup_alignment is mapping
      - backup_alignment.artifact is match('^ghcr\.io/dhhyi/recipe-db-releases@sha256:[0-9a-f]{64}$')
      - backup_alignment.revision is match('^[0-9a-f]{40}$')
      - backup_capture_revision == backup_alignment.revision
    fail_msg: Alignment requires the exact retained accepted candidate and capture revision.
  when: backup_alignment is defined
  no_log: true

- name: Read the installed uploader state directory before alignment
  ansible.builtin.slurp:
    src: /etc/recipe-db/backup.json
  register: backup_alignment_configuration
  when: backup_alignment is defined
  no_log: true

- name: Require the canonical retained maintenance directory during alignment
  ansible.builtin.assert:
    that:
      - (backup_alignment_configuration.content | b64decode | from_json).stateDirectory == '/var/lib/recipe-db-backup'
    fail_msg: Alignment requires the managed uploader state directory.
  when: backup_alignment is defined
  no_log: true

- name: Inspect retained accepted release and target without changing lifecycle state
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mise
      - exec
      - --
      - bash
      - /opt/recipe-db/.scripts/production-k3d.sh
      - backup-status
      - /etc/recipe-db/backup-values.yaml
      - /var/lib/recipe-db-backup/maintenance
    chdir: /var/lib/recipe-db-backup
  environment: "{{ backup_toolchain_environment | combine({'KUBECONFIG': '/etc/recipe-db/backup-kubeconfig.yaml'}) }}"
  register: backup_alignment_status
  changed_when: false
  when: backup_alignment is defined
  no_log: true

- name: Require candidate-bound acceptance and the retained release Lease before alignment
  ansible.builtin.assert:
    that:
      - retained.state.status == 'release-accepted'
      - retained.state.phase == 'operator-accepted'
      - retained.state.acceptedAt | length > 0
      - retained.state.websiteCheck.outcome == 'passed'
      - retained.state.candidate.artifact == backup_alignment.artifact
      - retained.state.candidate.revision == backup_alignment.revision
      - retained.state.postReleaseBackup.artifact == backup_alignment.artifact
      - retained.state.postReleaseBackup.revision == backup_alignment.revision
      - retained.state.postReleaseBackup.status == 'verified-upload'
      - retained.state.postReleaseBackup.uploadStatus == 'verified-upload'
      - retained.state.postReleaseBackup.storageVersions | length > 0
      - retained.state.source.target == 'pi'
      - retained.state.source.cluster == backup_alignment.cluster
      - retained.state.source.context == backup_alignment.context
      - retained.state.source.namespace == backup_alignment.namespace
      - retained.state.backupId == backup_alignment.holder
      - retained.lease.spec.holderIdentity == backup_alignment.holder
      - retained.lease.metadata.labels['app.kubernetes.io/part-of'] == 'recipe-db'
      - retained.lease.metadata.annotations['recipe-db/operation'] == 'backup'
      - retained.lease.metadata.annotations['recipe-db/release'] == retained.state.source.artifact
      - retained.lease.metadata.annotations['recipe-db/phase'] == 'release-accepted'
    fail_msg: Alignment requires a passed website check, verified candidate backup and matching retained acceptance Lease.
  vars:
    retained: "{{ backup_alignment_status.stdout | from_json }}"
  when: backup_alignment is defined
  no_log: true

- name: Create the private backup toolchain configuration directory
  ansible.builtin.file:
    path: /etc/recipe-db/backup-toolchain
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download checksum-pinned ARM64 Mise binary
  ansible.builtin.get_url:
    url: "https://github.com/jdx/mise/releases/download/v{{ backup_mise_version }}/mise-v{{ backup_mise_version }}-linux-arm64"
    dest: "/var/cache/recipe-db/mise-v{{ backup_mise_version }}-linux-arm64"
    checksum: "sha256:{{ backup_mise_sha256 }}"
    owner: root
    group: root
    mode: "0600"

- name: Install checksum-pinned Mise
  ansible.builtin.copy:
    src: "/var/cache/recipe-db/mise-v{{ backup_mise_version }}-linux-arm64"
    remote_src: true
    dest: /usr/local/bin/mise
    owner: root
    group: root
    mode: "0755"

- name: Configure only pinned backup capture tools without development hooks
  ansible.builtin.template:
    src: backup-toolchain.toml.j2
    dest: /etc/recipe-db/backup-toolchain/config.toml
    owner: root
    group: root
    mode: "0600"

- name: Inspect missing backup capture tools
  ansible.builtin.command:
    argv: [/usr/local/bin/mise, ls, --missing, --json]
    chdir: /var/lib/recipe-db-backup
  environment: "{{ backup_toolchain_environment }}"
  register: backup_missing_tools
  changed_when: false

- name: Install missing pinned backup capture tools
  ansible.builtin.command:
    argv: [/usr/local/bin/mise, install]
    chdir: /var/lib/recipe-db-backup
  environment: "{{ backup_toolchain_environment }}"
  when: backup_missing_tools.stdout | from_json | length > 0
  changed_when: true

- name: Verify the pinned backup capture toolchain is complete
  ansible.builtin.command:
    argv: [/usr/local/bin/mise, ls, --missing, --json]
    chdir: /var/lib/recipe-db-backup
  environment: "{{ backup_toolchain_environment }}"
  register: backup_missing_tools_after
  changed_when: false
  failed_when: >-
    backup_missing_tools_after.rc != 0 or backup_missing_tools_after.stdout | from_json | length > 0

- name: Check out the explicitly selected immutable backup capture release
  ansible.builtin.git:
    repo: https://github.com/dhhyi/recipe-db.git
    dest: /opt/recipe-db
    version: "{{ backup_capture_revision }}"
    force: false
    recursive: false
  when: backup_capture_revision != ''

- name: Install the private capture command
  ansible.builtin.template:
    src: recipe-db-backup-capture.j2
    dest: /usr/local/sbin/recipe-db-backup-capture
    owner: root
    group: root
    mode: "0700"
