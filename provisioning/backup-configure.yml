- name: Install operator-prepared backup inputs on the Pi
  hosts: pi
  gather_facts: false
  become: true
  vars:
    operator_config_directory: /home/vscode/.config/recipe-db
    operator_backup_directory: "{{ operator_config_directory }}/backup"
    operator_deployment_directory: "{{ operator_config_directory }}/deployment"
    operator_backup_files:
      - { name: backup.json, destination: /etc/recipe-db/backup.json }
      - {
          name: backup-release-ref,
          destination: /etc/recipe-db/backup-release-ref,
        }
    operator_backup_source_names:
      - backup.json
      - backup-values.yaml
      - backup-release-ref
    allowed_application_inputs:
      - auth-accounts.json
      - google-oauth-client-secret
      - oauth2-cookie-secret
      - acme-account-email
  tasks:
    - name: Keep scheduled capture disabled while installing operator inputs
      ansible.builtin.systemd_service:
        name: recipe-db-backup.timer
        enabled: false
        state: stopped

    - name: Refuse configuration changes while a backup is running
      ansible.builtin.command: systemctl show --property=ActiveState --value recipe-db-backup.service
      register: backup_service_active
      changed_when: false
      failed_when: backup_service_active.rc != 0 or backup_service_active.stdout not in ['inactive', 'failed']

    - name: Check whether backup configuration is installed
      ansible.builtin.stat:
        path: /etc/recipe-db/backup.json
      register: backup_configuration

    - name: Inspect maintenance state without displaying private details
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/recipe-db-backup-upload
          - status
          - --config
          - /etc/recipe-db/backup.json
      register: backup_lifecycle_status
      changed_when: false
      when: backup_configuration.stat.exists
      no_log: true

    - name: Refuse backup input changes during release maintenance
      ansible.builtin.assert:
        that:
          - not ((backup_lifecycle_status.stdout | from_json).maintenanceActive | default(false)) or backup_alignment is defined
        fail_msg: Resolve retained maintenance or explicitly align its accepted candidate.
      when: backup_configuration.stat.exists
      no_log: true

    - name: Validate explicit accepted-release alignment inputs
      ansible.builtin.assert:
        that:
          - backup_configuration.stat.exists
          - (backup_lifecycle_status.stdout | from_json).maintenanceActive
          - backup_alignment is mapping
          - backup_alignment.artifact is match('^ghcr\.io/dhhyi/recipe-db-releases@sha256:[0-9a-f]{64}$')
          - backup_alignment.revision is match('^[0-9a-f]{40}$')
        fail_msg: Alignment requires the exact retained accepted candidate.
      when: backup_alignment is defined
      no_log: true

    - name: Inspect retained accepted release and target without changing lifecycle state
      ansible.builtin.command:
        argv:
          - /usr/local/bin/mise
          - exec
          - --
          - bash
          - /opt/recipe-db/.scripts/production-k3d.sh
          - backup-status
          - /etc/recipe-db/backup-values.yaml
          - /var/lib/recipe-db-backup/maintenance
        chdir: /var/lib/recipe-db-backup
      environment: "{{ backup_toolchain_environment | combine({'KUBECONFIG': '/etc/recipe-db/backup-kubeconfig.yaml'}) }}"
      register: backup_alignment_status
      changed_when: false
      when: backup_alignment is defined
      no_log: true

    - name: Require candidate-bound acceptance and the retained release Lease before alignment
      ansible.builtin.assert:
        that:
          - retained.state.status == 'release-accepted'
          - retained.state.phase == 'operator-accepted'
          - retained.state.acceptedAt | length > 0
          - retained.state.websiteCheck.outcome == 'passed'
          - retained.state.candidate.artifact == backup_alignment.artifact
          - retained.state.candidate.revision == backup_alignment.revision
          - retained.state.postReleaseBackup.artifact == backup_alignment.artifact
          - retained.state.postReleaseBackup.revision == backup_alignment.revision
          - retained.state.postReleaseBackup.status == 'verified-upload'
          - retained.state.postReleaseBackup.uploadStatus == 'verified-upload'
          - retained.state.postReleaseBackup.storageVersions | length > 0
          - retained.state.source.target == 'pi'
          - retained.state.source.cluster == backup_alignment.cluster
          - retained.state.source.context == backup_alignment.context
          - retained.state.source.namespace == backup_alignment.namespace
          - retained.state.backupId == backup_alignment.holder
          - retained.lease.spec.holderIdentity == backup_alignment.holder
          - retained.lease.metadata.labels['app.kubernetes.io/part-of'] == 'recipe-db'
          - retained.lease.metadata.annotations['recipe-db/operation'] == 'backup'
          - retained.lease.metadata.annotations['recipe-db/release'] == retained.state.source.artifact
          - retained.lease.metadata.annotations['recipe-db/phase'] == 'release-accepted'
        fail_msg: Alignment requires a passed website check, verified candidate backup and matching retained acceptance Lease.
      vars:
        retained: "{{ backup_alignment_status.stdout | from_json }}"
      when: backup_alignment is defined
      no_log: true

    - name: Check for retained maintenance state without backup configuration
      ansible.builtin.stat:
        path: /var/lib/recipe-db-backup/maintenance
      register: unconfigured_maintenance_state
      when: not backup_configuration.stat.exists

    - name: Refuse configuration without checking an existing maintenance operation
      ansible.builtin.assert:
        that:
          - not (unconfigured_maintenance_state.stat.exists | default(false))
          - not (unconfigured_maintenance_state.stat.islnk | default(false))
        fail_msg: Resolve the retained maintenance operation before installing backup inputs.
      when: not backup_configuration.stat.exists
      no_log: true

    - name: Inspect Pi-owned Drive authorization without retrieving it
      ansible.builtin.stat:
        path: /etc/recipe-db/rclone.conf
        get_checksum: false
        get_mime: false
      register: pi_drive_authorization
      no_log: true

    - name: Require private Pi-owned Drive authorization
      ansible.builtin.assert:
        that:
          - pi_drive_authorization.stat.exists
          - pi_drive_authorization.stat.isreg | default(false)
          - not (pi_drive_authorization.stat.islnk | default(false))
          - pi_drive_authorization.stat.size | default(0) > 0
          - pi_drive_authorization.stat.uid | default(-1) == 0
          - pi_drive_authorization.stat.gid | default(-1) == 0
          - pi_drive_authorization.stat.mode | default('') == '0600'
        fail_msg: Authorize Drive interactively on the Pi first; rclone.conf must be root-owned mode 0600.

    - name: Read prepared backup configuration without displaying it
      ansible.builtin.set_fact:
        backup_settings: >-
          {{ lookup('ansible.builtin.file', operator_backup_directory ~ '/backup.json') | from_json }}
        backup_values: >-
          {{ lookup('ansible.builtin.file', operator_backup_directory ~ '/backup-values.yaml') | from_yaml }}
        backup_release: >-
          {{ lookup('ansible.builtin.file', operator_backup_directory ~ '/backup-release-ref') | trim }}
      no_log: true

    - name: Validate backup configuration and private input references
      ansible.builtin.assert:
        that:
          - backup_settings is mapping
          - backup_settings.rcloneConfig == '/etc/recipe-db/rclone.conf'
          - backup_settings.captureCommand == '/usr/local/sbin/recipe-db-backup-capture'
          - backup_settings.stateDirectory == '/var/lib/recipe-db-backup'
          - backup_settings.stagingDirectory == '/var/lib/recipe-db-backup/work'
          - backup_release is match('^ghcr\.io/dhhyi/recipe-db-releases@sha256:[0-9a-f]{64}$')
          - backup_values is mapping
          - backup_values.secrets is mapping
          - "'auth-accounts.json' in backup_values.secrets"
          - backup_values.secrets | length > 0
          - backup_values.secrets.keys() | list | difference(allowed_application_inputs) | length == 0
        fail_msg: Backup inputs are incomplete or reference unsupported private files.
      no_log: true

    - name: Require each private application input to be a direct deployment file
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value.startswith(operator_deployment_directory ~ '/')
          - item.value | dirname == operator_deployment_directory
        fail_msg: Backup values reference an unsupported private input path.
      loop: "{{ backup_values.secrets | dict2items }}"
      no_log: true

    - name: Map private application inputs to their Pi paths
      ansible.builtin.set_fact:
        backup_pi_secret_paths: >-
          {{ backup_pi_secret_paths | default({}) |
             combine({item.key: '/etc/recipe-db/application-inputs/' ~ item.key}) }}
      loop: "{{ backup_values.secrets | dict2items }}"
      no_log: true

    - name: Read installed backup settings before accepted-release alignment
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/recipe-db/backup.json
        - /etc/recipe-db/backup-values.yaml
      register: backup_alignment_installed
      when: backup_alignment is defined
      no_log: true

    - name: Keep the retained operation target and uploader settings unchanged during alignment
      ansible.builtin.assert:
        that:
          - backup_release == backup_alignment.artifact
          - backup_settings == (backup_alignment_installed.results[0].content | b64decode | from_json)
          - >-
            (backup_values | combine({'secrets': backup_pi_secret_paths})) == (backup_alignment_installed.results[1].content | b64decode | from_yaml)
        fail_msg: Accepted-release alignment may change the release reference, not the retained target or uploader settings.
      when: backup_alignment is defined
      no_log: true

    - name: Inspect prepared backup files on the provisioning controller
      ansible.builtin.stat:
        path: "{{ operator_backup_directory }}/{{ item }}"
      delegate_to: localhost
      become: false
      loop: "{{ operator_backup_source_names }}"
      register: prepared_backup_files
      no_log: true

    - name: Require regular prepared backup files
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.size > 0
        fail_msg: A required prepared backup file is unavailable.
      loop: "{{ prepared_backup_files.results }}"
      no_log: true

    - name: Inspect referenced private application inputs on the controller
      ansible.builtin.stat:
        path: "{{ item.value }}"
      delegate_to: localhost
      become: false
      loop: "{{ backup_values.secrets | dict2items }}"
      register: prepared_application_inputs
      no_log: true

    - name: Require regular referenced application inputs
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.size > 0
        fail_msg: A referenced private application input is unavailable.
      loop: "{{ prepared_application_inputs.results }}"
      no_log: true

    - name: Invalidate the prior backup configuration generation
      ansible.builtin.file:
        path: /etc/recipe-db/backup-configured-at
        state: absent

    - name: Create root-only backup configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/recipe-db
        - /etc/recipe-db/application-inputs

    - name: Copy prepared backup configuration files
      ansible.builtin.copy:
        src: "{{ operator_backup_directory }}/{{ item.name }}"
        dest: "{{ item.destination }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ operator_backup_files }}"
      no_log: true

    - name: Copy referenced private application inputs
      ansible.builtin.copy:
        src: "{{ item.value }}"
        dest: "/etc/recipe-db/application-inputs/{{ item.key }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ backup_values.secrets | dict2items }}"
      no_log: true

    - name: Install backup values with private Pi input paths
      ansible.builtin.copy:
        content: >-
          {{ backup_values | combine({'secrets': backup_pi_secret_paths}, recursive=True) | to_nice_yaml }}
        dest: /etc/recipe-db/backup-values.yaml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Record the completed backup configuration generation
      ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%S+00:00
      register: backup_configuration_timestamp
      changed_when: false
      no_log: true

    - name: Save the private backup configuration generation marker
      ansible.builtin.copy:
        content: "{{ backup_configuration_timestamp.stdout }}\n"
        dest: /etc/recipe-db/backup-configured-at
        owner: root
        group: root
        mode: "0600"
      no_log: true
