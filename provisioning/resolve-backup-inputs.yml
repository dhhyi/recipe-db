- name: Resolve private application input sources from the configuration root
  ansible.builtin.set_fact:
    operator_backup_secret_sources: >-
      {{ operator_backup_secret_sources | default({}) |
         combine({item.key: item.value | operator_deployment_file(operator_config_directory)}) }}
  delegate_to: localhost
  become: false
  loop: "{{ backup_values.secrets | dict2items }}"
  no_log: true

- name: Map private application inputs to their Pi paths
  ansible.builtin.set_fact:
    backup_pi_secret_paths: >-
      {{ backup_pi_secret_paths | default({}) |
         combine({item.key: '/etc/recipe-db/application-inputs/' ~ item.key}) }}
  loop: "{{ backup_values.secrets | dict2items }}"
  no_log: true

- name: Prepare backup values with private Pi input paths
  ansible.builtin.set_fact:
    operator_backup_values_for_pi: >-
      {{ backup_values | combine({'secrets': backup_pi_secret_paths}, recursive=True) }}
  no_log: true
