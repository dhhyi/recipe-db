# Accelerated isolated-test policy; managed deployments retain 168h/50m.
reverse_proxy = true
auth_logging = false
request_logging = false
email_domains = ["*"]
redirect_url = "http://app.poc.test/oauth2/callback"
whitelist_domains = ["app.poc.test"]
skip_provider_button = true
cookie_name = "_oauth2_proxy"
cookie_secret_file = "/run/secrets/cookie"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "60s"
cookie_refresh = "20s"
cookie_csrf_per_request = true
cookie_csrf_expire = "5m"
session_store_type = "redis"
redis_connection_url = "redis://redis:6379"
