services:
  _: #@ template.replace(service_map())
volumes:
  #@ if len([p for p in deploy_projects if p.name == "search"]) > 0:
  typesense-data:
    name: recipe-db-typesense-data
  search-data:
    name: recipe-db-search-data
  #@ end
  #@ if len([p for p in deploy_projects if p.name == "graphql"]) > 0:
  oauth2-sessions-data:
    name: recipe-db-oauth2-sessions-data
  #@ end
  nats-data:
    name: recipe-db-nats-data
  #@ if options.production:
  data:
    name: recipe-db-data
#@ end
#@ if len([p for p in deploy_projects if p.name == "search"]) > 0 or len([p for p in deploy_projects if p.name == "graphql"]) > 0:
secrets:
  #@ if len([p for p in deploy_projects if p.name == "graphql"]) > 0:
  auth-accounts.json:
    file: ./.secrets/auth-accounts.json
  google-oauth-client-secret:
    #@ if options.production:
    file: ${GOOGLE_OAUTH_CLIENT_SECRET_FILE:?Set GOOGLE_OAUTH_CLIENT_SECRET_FILE to the mounted OAuth client-secret file}
    #@ else:
    file: ${GOOGLE_OAUTH_CLIENT_SECRET_FILE:-./.secrets/google-oauth-client-secret}
    #@ end
  oauth2-cookie-secret:
    #@ if options.production:
    file: ${OAUTH2_COOKIE_SECRET_FILE:?Set OAUTH2_COOKIE_SECRET_FILE to the mounted OAuth cookie-secret file}
    #@ else:
    file: ${OAUTH2_COOKIE_SECRET_FILE:-./.secrets/oauth2-cookie-secret}
    #@ end
  #@ end
  #@ if len([p for p in deploy_projects if p.name == "search"]) > 0:
  typesense-api-key:
    #@ if options.production:
    file: ${TYPESENSE_API_KEY_FILE:?Set TYPESENSE_API_KEY_FILE to a private Typesense API key file}
    #@ else:
    file: ${TYPESENSE_API_KEY_FILE:-./.secrets/typesense-api-key}
    #@ end
  #@ end
  #@ end
networks:
  intranet:
    name: intranet
    external: true
  #@ if len([p for p in deploy_projects if p.name == "graphql"]) > 0:
  auth-ingress:
    name: recipe-db-auth-ingress
    internal: true
    ipam:
      config:
        - subnet: #@ data.values.authIngressSubnet
  oauth2-sessions:
    name: recipe-db-oauth2-sessions
    internal: true
  oauth2-egress:
    name: recipe-db-oauth2-egress
#@ end
