services:
  _: #@ template.replace(service_map())
volumes:
  #@ if len([p for p in deploy_projects if p.name == "search"]) > 0:
  typesense-data:
    name: recipe-db-typesense-data
  search-data:
    name: recipe-db-search-data
  #@ end
  #@ if len([p for p in deploy_projects if p.name == "tags"]) > 0:
  tags-data:
    name: recipe-db-tags-data
  #@ end
  oauth2-sessions-data:
    name: recipe-db-oauth2-sessions-data
  nats-data:
    name: recipe-db-nats-data
secrets:
  auth-accounts.json:
    file: ./.secrets/auth-accounts.json
  google-oauth-client-secret:
    file: ${GOOGLE_OAUTH_CLIENT_SECRET_FILE:-./.secrets/google-oauth-client-secret}
  oauth2-cookie-secret:
    file: ${OAUTH2_COOKIE_SECRET_FILE:-./.secrets/oauth2-cookie-secret}
  #@ if len([p for p in deploy_projects if p.name == "search"]) > 0:
  typesense-api-key:
    file: ${TYPESENSE_API_KEY_FILE:-./.secrets/typesense-api-key}
  #@ end
networks:
  intranet:
    name: intranet
    external: true
  auth-ingress:
    name: recipe-db-auth-ingress
    internal: true
  oauth2-ingress:
    name: recipe-db-oauth2-ingress
    internal: true
  oauth2-sessions:
    name: recipe-db-oauth2-sessions
    internal: true
  oauth2-egress:
    name: recipe-db-oauth2-egress
