version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /design
      - /e2e-test
      - /images-edit
      - /recipes-edit
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /graphql
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /browse
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directories:
      - /link-extract-test
      - /mcp-test
      - /search
      - /search-test
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: maven
    directory: /recipes-test
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /tags-test
    schedule:
      interval: daily
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
