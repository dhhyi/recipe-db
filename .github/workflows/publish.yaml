name: Publish
concurrency:
  group: publish
  cancel-in-progress: true
on:
  push:
    branches:
      - main

jobs:
  test-and-publish:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache: true
          version: "12"
          install: false

      - name: report versions
        run: |
          set -x
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: install @devcontainers/cli
        run: |
          pnpm i -g @devcontainers/cli@latest
          devcontainer --version

      - name: synchronize
        run: |
          echo "::group::pnpm install"
          pnpm i --frozen-lockfile
          echo "::endgroup::"

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: create buildx builder
        run: docker buildx create --use

      - name: build dev images
        run: |
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          echo "::group::docker compose build"
          docker compose --profile development build
          echo "::endgroup::"

      - name: test projects
        run: |
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          echo "::group::docker compose up"
          docker compose up -d --wait || (docker compose logs && exit 1)
          echo "::endgroup::"
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          for project in $(ls */.project.yaml | xargs dirname); do
            test_cmd=$(yq eval 'select(documentIndex==1) | .test // ""' $project/.project.yaml)
            if [ -n "$test_cmd" ]; then
              echo "::group::test $project"
              pnpm in-devcontainer $project test
              echo "::endgroup::"
            fi
          done

      - name: build and push prod images
        run: |
          echo "::group::generate prod docker-compose.yml"
          npm run generate-docker-compose prod
          echo "::endgroup::"
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          docker compose build
          docker compose push

  calc:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: find projects
        id: find
        run: |
          projects=$(ls */.project.yaml | xargs dirname | xargs -I {} echo -n '"{}",' | sed -e s/,$//)
          echo "projects=[${projects}]" >> $GITHUB_OUTPUT
          echo "::group::GITHUB_OUTPUT"
          cat $GITHUB_OUTPUT
          echo "::endgroup::"

  devcontainers:
    permissions: write-all
    runs-on: ubuntu-latest
    needs:
      - calc
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        project: ${{ fromJson(needs.calc.outputs.projects) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - uses: pnpm/setup@v2
        with:
          cache: true
          version: "12"

      - name: install devcontainer CLI
        run: |
          pnpm i -g @devcontainers/cli@latest
          devcontainer --version

      - name: create buildx builder
        run: docker buildx create --use

      - name: dcc push cache
        run: sh ${{ matrix.project }}/.update_devcontainer.sh --build --push-cache -vv

      - name: precommit check
        run: pnpm in-devcontainer ${{ matrix.project }} precommit
