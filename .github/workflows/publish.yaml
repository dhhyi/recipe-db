name: Publish
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action != 'edited' || github.event.changes.title != null) }}
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
permissions:
  contents: read

env:
  BUILDKIT_PROGRESS: quiet
  COMPOSE_PROGRESS: quiet
  TYPESENSE_API_KEY_FILE: /tmp/recipe-db-typesense-ci-api-key

jobs:
  quality-checks:
    # Ignore non-title edits; removing [WIP] starts validation without another commit.
    if: >-
      (github.event_name != 'pull_request' ||
       !contains(github.event.pull_request.title, '[WIP]')) &&
      (github.event.action != 'edited' || github.event.changes.title != null)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PARALLEL_LIMIT: 1
      DEVCONTAINER_KEEP_RUNNING: "true"
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: create private search key for Compose validation
        run: |
          umask 077
          openssl rand -hex 32 > "$TYPESENSE_API_KEY_FILE"

      - name: setup mise tools
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: install tools and synchronize
        run: mise install

      - name: report versions
        run: |
          set -x
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-

      - name: format project files
        run: |
          pnpm exec prettier --log-level warn --write .
          echo "::group::generate format targets"
          mise run --raw generate-bazel-build
          targets=$(mise exec -- bazelisk query 'attr(name, "_format$", //:all)')
          mapfile -t format_targets <<< "$targets"
          echo "::endgroup::"
          mise exec -- bazelisk build \
            --action_env=PATH \
            --action_env=CI \
            --action_env=GITHUB_ACTIONS \
            --action_env=BUILDKIT_PROGRESS \
            --action_env=COMPOSE_PROGRESS \
            --action_env=COMPOSE_PARALLEL_LIMIT \
            --action_env=DEVCONTAINER_KEEP_RUNNING \
            --jobs=1 --disk_cache="$HOME/.cache/bazel-disk" "${format_targets[@]}"
          echo "::group::extract formatted files and check diff"
          for target in "${format_targets[@]}"; do
            project=${target#//:}
            tar -xf "bazel-bin/${project%_format}-format.tar"
          done
          git diff --exit-code
          echo "::endgroup::"

      - name: Bazel precommit checks and unit tests
        run: |
          mise run --raw generate-bazel-build
          mise exec -- bazelisk build \
            --action_env=PATH \
            --action_env=CI \
            --action_env=GITHUB_ACTIONS \
            --action_env=BUILDKIT_PROGRESS \
            --action_env=COMPOSE_PROGRESS \
            --action_env=COMPOSE_PARALLEL_LIMIT \
            --action_env=DEVCONTAINER_KEEP_RUNNING \
            --jobs=1 --disk_cache="$HOME/.cache/bazel-disk" //:all

      - name: validate message bus integration and recovery
        run: mise run test-message-bus

  arm64-validation:
    if: >-
      (github.event_name != 'pull_request' ||
       !contains(github.event.pull_request.title, '[WIP]')) &&
      (github.event.action != 'edited' || github.event.changes.title != null)
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    env:
      COMPOSE_PARALLEL_LIMIT: 1
      REGISTRY_CACHE_SUFFIX: "-arm64"
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: create private search key for Compose validation
        run: |
          umask 077
          openssl rand -hex 32 > "$TYPESENSE_API_KEY_FILE"

      - name: setup mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: install Compose generation tools
        run: mise --no-hooks install jq yq ytt

      - name: login to ghcr.io for ARM64 build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: prepare ARM64 build context without devcontainers
        run: |
          echo "::group::verify ARM64 runner and Docker daemon"
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "Expected a native ARM64 runner, got $(uname -m)." >&2; exit 1 ;;
          esac
          case "$(docker info --format '{{.Architecture}}')" in
            aarch64|arm64) ;;
            *) echo "Expected a native ARM64 Docker daemon." >&2; exit 1 ;;
          esac
          echo "::endgroup::"
          echo "::group::prepare ARM64 build context"
          docker buildx create --use
          docker buildx inspect --bootstrap
          mise run --raw sync-files
          mkdir -p .secrets
          printf '%s\n' '{"anonymous":{"role":"anonymous"},"tokens":[],"googleAccounts":{}}' > .secrets/auth-accounts.json
          openssl rand -hex 32 > .secrets/google-oauth-client-secret
          openssl rand -base64 32 > .secrets/oauth2-cookie-secret
          chmod 600 .secrets/auth-accounts.json
          chmod 600 .secrets/google-oauth-client-secret .secrets/oauth2-cookie-secret
          ingress_config=$(python3 - <<'PY'
          import ipaddress
          import json
          import subprocess

          occupied = []
          routes = subprocess.check_output(["ip", "-4", "route", "show", "table", "all"], text=True)
          for route in routes.splitlines():
              fields = route.split()
              network = fields[1] if fields[0] in {"local", "broadcast", "unicast", "unreachable", "prohibit", "blackhole", "throw"} else fields[0]
              if network != "default":
                  try:
                      occupied.append(ipaddress.ip_network(network, strict=False))
                  except ValueError:
                      pass
          addresses = json.loads(subprocess.check_output(["ip", "-j", "-4", "addr", "show"], text=True))
          for interface in addresses:
              for address in interface.get("addr_info", []):
                  if address.get("family") == "inet":
                      occupied.append(ipaddress.ip_network(f'{address["local"]}/{address["prefixlen"]}', strict=False))

          network_ids = subprocess.check_output(["docker", "network", "ls", "-q"], text=True).split()
          if network_ids:
              networks = json.loads(subprocess.check_output(["docker", "network", "inspect", *network_ids], text=True))
              for network in networks:
                  for config in network.get("IPAM", {}).get("Config") or []:
                      if config.get("Subnet"):
                          occupied.append(ipaddress.ip_network(config["Subnet"], strict=False))

          candidates = (
              [ipaddress.ip_network(f"10.{second}.{third}.0/24") for second in range(240, 256) for third in range(256)]
              + [ipaddress.ip_network(f"192.168.{third}.0/24") for third in range(200, 256)]
          )
          for subnet in candidates:
              if not any(subnet.overlaps(network) for network in occupied):
                  print(f"{subnet}\t{subnet.network_address + 254}")
                  break
          else:
              raise SystemExit("Could not find an unused private subnet for the auth ingress network")
          PY
          )
          IFS=$'\t' read -r AUTH_INGRESS_SUBNET GRAPHQL_TRUSTED_INGRESS_IP <<< "$ingress_config"
          printf 'AUTH_INGRESS_SUBNET=%s\nGRAPHQL_TRUSTED_INGRESS_IP=%s\n' "$AUTH_INGRESS_SUBNET" "$GRAPHQL_TRUSTED_INGRESS_IP" >> "$GITHUB_ENV"
          export AUTH_INGRESS_SUBNET GRAPHQL_TRUSTED_INGRESS_IP
          mise run --raw generate-docker-compose
          mise run create-intranet
          echo "::endgroup::"

      - name: build development and standalone test images
        run: docker compose --profile development --profile test build

      - name: start development stack and run standalone integration tests
        env:
          VERBOSE: "true"
        run: |
          echo "::group::start development stack"
          docker compose up -d --wait --wait-timeout 120 || { docker compose logs --no-color; exit 1; }
          docker compose ps
          echo "::endgroup::"
          mise run integration-tests -- --development || { docker compose logs --no-color; exit 1; }

      - name: upload ARM64 end-to-end screenshots, ARIA snapshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-e2e-reports
          path: e2e-test/target/
          if-no-files-found: ignore

      - name: verify development and test images are native ARM64
        run: |
          set -euo pipefail
          mapfile -t images < <(docker compose --profile development --profile test config --images | sort -u)
          for image in "${images[@]}"; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/arm64 ]]; then
              echo "$image was built for $platform, expected linux/arm64." >&2
              exit 1
            fi
          done

      - name: clean up development and test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: generate production Compose configuration
        env:
          CI: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || '' }}
        run: mise run generate-docker-compose prod

      - name: validate production configuration and build ARM64 images
        run: |
          echo "::group::validate production Compose configuration and build images"
          docker compose config --quiet
          docker compose build
          echo "::endgroup::"
          echo "::group::verify production image architectures"
          mapfile -t images < <(docker compose config --images | sort -u)
          for image in "${images[@]}"; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/arm64 ]]; then
              echo "$image was built for $platform, expected linux/arm64." >&2
              exit 1
            fi
          done
          echo "::endgroup::"

      - name: upload integration reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-integration-reports
          path: |
            **/target/integration-tests/**
            **/target/surefire-reports/**
            **/target/junit.xml
          if-no-files-found: ignore

  publish:
    needs:
      - quality-checks
      - arm64-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: create private search key for Compose validation
        run: |
          umask 077
          openssl rand -hex 32 > "$TYPESENSE_API_KEY_FILE"

      - name: setup mise tools
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: create buildx builder
        run: docker buildx create --use

      - name: install tools and synchronize
        run: mise install

      - name: build and push production images
        run: |
          echo "::group::generate production docker-compose.yml"
          mise run generate-docker-compose prod
          echo "::endgroup::"
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          echo "::group::docker compose build"
          docker compose build
          echo "::endgroup::"
          echo "::group::docker compose push"
          docker compose push
          echo "::endgroup::"

      - name: build and push devcontainers
        run: |
          for project in $(ls */.project.yaml | xargs dirname); do
            has_publish=$(mise exec -- yq eval 'select(documentIndex==0) | .devcontainer.publish.image // ""' "$project/.project.yaml")
            if [ -z "$has_publish" ]; then
              continue
            fi
            echo "::group::build and push devcontainer $project"
            sh $project/.update_devcontainer.sh --build --push-cache -vv
            echo "::endgroup::"
          done
