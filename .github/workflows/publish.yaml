name: Publish
concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  queue: ${{ github.event_name == 'push' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
permissions:
  contents: read

env:
  BUILDKIT_PROGRESS: quiet
  COMPOSE_PROGRESS: quiet

jobs:
  quality-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      cache_restore_outcome: ${{ steps.cache-outcomes.outputs.restore_outcome }}
      cache_inspect_outcome: ${{ steps.cache-outcomes.outputs.inspect_outcome }}
      cache_prune_outcome: ${{ steps.cache-outcomes.outputs.prune_outcome }}
      cache_prepare_outcome: ${{ steps.cache-outcomes.outputs.prepare_outcome }}
      cache_upload_outcome: ${{ steps.cache-outcomes.outputs.upload_outcome }}
      cache_prune_needed: ${{ steps.cache-outcomes.outputs.prune_needed }}
      cache_failure_reason: ${{ steps.cache-outcomes.outputs.failure_reason }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PARALLEL_LIMIT: 1
      DEVCONTAINER_KEEP_RUNNING: "true"
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: verify exact source revision
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [[ $source_sha != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked out $source_sha, expected event source $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi
          echo "Building exact source revision $source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: setup mise tools
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: install fish for shell compatibility tests
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: install tools and synchronize
        # The generator's shared cache directory creation is not concurrency-safe.
        env:
          MISE_JOBS: "1"
        run: mise install

      - name: report versions
        run: |
          set -x
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: restore and union Bazel disk cache artifacts
        id: restore-cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          python3 .scripts/bazel-cache-artifacts.py restore \
            --cache "$HOME/.cache/bazel-disk" \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "${{ steps.source.outputs.sha }}" \
            --pr-number "$PR_NUMBER" \
            --output "$GITHUB_OUTPUT"

      - name: record Bazel cache build start
        id: cache-build-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: check project formatting
        id: format
        env:
          BAZEL_DIAGNOSTICS_DIR: ${{ runner.temp }}/bazel-diagnostics
        run: |
          pnpm exec prettier --log-level warn --check .
          echo "::group::generate format targets"
          mise run --raw generate-bazel-build
          targets=$(mise run --raw bazel query 'attr(name, "_format_check$", //:all)')
          mapfile -t format_targets <<< "$targets"
          echo "::endgroup::"
          mise run --raw bazel build \
            --action_env=PATH \
            --action_env=CI \
            --action_env=GITHUB_ACTIONS \
            --action_env=BUILDKIT_PROGRESS \
            --action_env=COMPOSE_PROGRESS \
            --action_env=COMPOSE_PARALLEL_LIMIT \
            --action_env=DEVCONTAINER_KEEP_RUNNING \
            --execution_log_json_file="$RUNNER_TEMP/bazel-format-execution.json" \
            --jobs=1 --disk_cache="$HOME/.cache/bazel-disk" "${format_targets[@]}"

      - name: Bazel precommit checks, unit tests, and cacheable validations
        id: checks
        env:
          BAZEL_DIAGNOSTICS_DIR: ${{ runner.temp }}/bazel-diagnostics
        run: |
          mise run --raw generate-bazel-build
          mise run --raw bazel build \
            --action_env=PATH \
            --action_env=CI \
            --action_env=GITHUB_ACTIONS \
            --action_env=BUILDKIT_PROGRESS \
            --action_env=COMPOSE_PROGRESS \
            --action_env=COMPOSE_PARALLEL_LIMIT \
            --action_env=DEVCONTAINER_KEEP_RUNNING \
            --execution_log_json_file="$RUNNER_TEMP/bazel-check-execution.json" \
            --jobs=1 --disk_cache="$HOME/.cache/bazel-disk" //:all

      - name: upload Bazel rebuild explanations
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: bazel-rebuild-explanations
          path: ${{ runner.temp }}/bazel-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: upload Bazel execution logs
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: bazel-execution-logs
          path: |
            ${{ runner.temp }}/bazel-format-execution.json
            ${{ runner.temp }}/bazel-check-execution.json
          if-no-files-found: ignore
          retention-days: 7

      - name: inspect Bazel cache
        id: inspect-cache
        if: always() && steps.source.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_PRUNE_ELIGIBLE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.format.outcome == 'success' && steps.checks.outcome == 'success' }}
        run: |
          python3 .scripts/bazel-cache-artifacts.py inspect \
            --cache "$HOME/.cache/bazel-disk" \
            --build-start "${{ steps.cache-build-start.outputs.epoch }}" \
            --eligible "$CACHE_PRUNE_ELIGIBLE" \
            --output "$GITHUB_OUTPUT"

      - name: prune Bazel cache
        id: prune-cache
        if: always() && steps.inspect-cache.outcome == 'success' && steps.inspect-cache.outputs.prune == 'true'
        continue-on-error: true
        run: |
          python3 .scripts/bazel-cache-artifacts.py prune \
            --cache "$HOME/.cache/bazel-disk" \
            --build-start "${{ steps.cache-build-start.outputs.epoch }}" \
            --output "$GITHUB_OUTPUT"

      - name: prepare Bazel cache snapshot
        id: prepare-bazel-cache
        if: >-
          always() && steps.source.outcome == 'success' && steps.inspect-cache.outcome == 'success'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CACHE_PRUNE_ELIGIBLE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.format.outcome == 'success' && steps.checks.outcome == 'success' }}
          CACHE_PRUNE_REQUIRED: ${{ steps.inspect-cache.outputs.prune }}
          CACHE_PRUNE_SUCCEEDED: ${{ steps.prune-cache.outcome == 'success' }}
        run: |
          python3 .scripts/bazel-cache-artifacts.py prepare-upload \
            --cache "$HOME/.cache/bazel-disk" \
            --archive "$RUNNER_TEMP/bazel-cache/snapshot.tar" \
            --manifest "$RUNNER_TEMP/bazel-cache/manifest.json" \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "${{ steps.source.outputs.sha }}" \
            --build-start "${{ steps.cache-build-start.outputs.epoch }}" \
            --prune-eligible "$CACHE_PRUNE_ELIGIBLE" \
            --prune-required "${CACHE_PRUNE_REQUIRED:-false}" \
            --prune-succeeded "$CACHE_PRUNE_SUCCEEDED" \
            --pr-number "$PR_NUMBER" \
            --execution-log "format=$RUNNER_TEMP/bazel-format-execution.json" \
            --execution-log "checks=$RUNNER_TEMP/bazel-check-execution.json" \
            --output "$GITHUB_OUTPUT"

      - name: upload Bazel cache snapshot
        id: upload-cache
        if: always() && steps.prepare-bazel-cache.outcome == 'success' && steps.prepare-bazel-cache.outputs.name != ''
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ steps.prepare-bazel-cache.outputs.name }}
          path: |
            ${{ runner.temp }}/bazel-cache/snapshot.tar
            ${{ runner.temp }}/bazel-cache/manifest.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 90 || 7 }}

      - name: report Bazel cache outcomes
        id: cache-outcomes
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore-cache.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect-cache.outcome }}
          PRUNE_OUTCOME: ${{ steps.prune-cache.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-bazel-cache.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-cache.outcome }}
          PRUNE_NEEDED: ${{ steps.inspect-cache.outputs.prune }}
          RESTORE_REASON: ${{ steps.restore-cache.outputs.reason }}
          INSPECT_REASON: ${{ steps.inspect-cache.outputs.reason }}
          PRUNE_REASON: ${{ steps.prune-cache.outputs.reason }}
          PREPARE_REASON: ${{ steps.prepare-bazel-cache.outputs.reason }}
        run: |
          set -euo pipefail
          outcome() {
            case "$1" in
              success) echo success ;;
              failure) echo failure ;;
              *) echo not-attempted ;;
            esac
          }
          restore=$(outcome "$RESTORE_OUTCOME")
          inspect=$(outcome "$INSPECT_OUTCOME")
          prune=$(outcome "$PRUNE_OUTCOME")
          prepare=$(outcome "$PREPARE_OUTCOME")
          upload=$(outcome "$UPLOAD_OUTCOME")
          reason=""
          if [[ $restore == failure ]]; then
            reason=${RESTORE_REASON:-"Cache restore failed; build continued with fallback."}
          elif [[ $inspect == failure ]]; then
            reason=${INSPECT_REASON:-"Cache inspection failed; see the inspect step."}
          elif [[ $prune == failure ]]; then
            reason=${PRUNE_REASON:-"Cache pruning failed; see the prune step."}
          elif [[ $prepare == failure ]]; then
            reason=${PREPARE_REASON:-"Cache preparation or validation failed; upload skipped."}
          elif [[ $upload == failure ]]; then
            reason="Cache artifact upload failed; see the upload step."
          fi
          reason=${reason//$'\n'/ }
          reason=${reason//$'\r'/ }
          {
            echo "restore_outcome=$restore"
            echo "inspect_outcome=$inspect"
            echo "prune_outcome=$prune"
            echo "prepare_outcome=$prepare"
            echo "upload_outcome=$upload"
            echo "prune_needed=${PRUNE_NEEDED:-not-attempted}"
            echo "failure_reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: build and validate production AMD64 images for pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *) echo "Expected a native AMD64 runner, got $(uname -m)." >&2; exit 1 ;;
          esac
          metadata="$RUNNER_TEMP/production-build-amd64.json"
          sh .scripts/generate-production-build-metadata.sh \
            "${{ steps.source.outputs.sha }}" linux/amd64 "$metadata" false
          docker buildx create --use
          docker buildx inspect --bootstrap
          docker buildx bake --file "$metadata" --load
          mapfile -t images < <(jq -r '.target[] | .tags[0]' "$metadata")
          for image in "${images[@]}"; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/amd64 ]]; then
              echo "$image was built for $platform, expected linux/amd64." >&2
              exit 1
            fi
          done
          smoke_image=$(jq -r '.target.design.tags[0]' "$metadata")
          sh .scripts/smoke-production-image.sh "$smoke_image"

  cache-health:
    needs: quality-checks
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (
        needs.quality-checks.outputs.cache_restore_outcome == 'failure' ||
        needs.quality-checks.outputs.cache_inspect_outcome == 'failure' ||
        needs.quality-checks.outputs.cache_prune_outcome == 'failure' ||
        needs.quality-checks.outputs.cache_prepare_outcome == 'failure' ||
        needs.quality-checks.outputs.cache_upload_outcome == 'failure' ||
        (
          needs.quality-checks.outputs.cache_prepare_outcome == 'success' &&
          needs.quality-checks.outputs.cache_upload_outcome == 'not-attempted'
        ) ||
        needs.quality-checks.outputs.cache_prune_needed == 'true' ||
        (
          needs.quality-checks.result == 'success' &&
          (
            needs.quality-checks.outputs.cache_restore_outcome == '' ||
            needs.quality-checks.outputs.cache_inspect_outcome == '' ||
            needs.quality-checks.outputs.cache_prepare_outcome == '' ||
            needs.quality-checks.outputs.cache_upload_outcome == ''
          )
        ) ||
        (
          needs.quality-checks.result == 'failure' &&
          (
            needs.quality-checks.outputs.cache_restore_outcome == '' ||
            needs.quality-checks.outputs.cache_inspect_outcome == '' ||
            needs.quality-checks.outputs.cache_prepare_outcome == '' ||
            needs.quality-checks.outputs.cache_upload_outcome == ''
          )
        )
      )
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: report cache health
        env:
          RESTORE_OUTCOME: ${{ needs.quality-checks.outputs.cache_restore_outcome }}
          INSPECT_OUTCOME: ${{ needs.quality-checks.outputs.cache_inspect_outcome }}
          PRUNE_OUTCOME: ${{ needs.quality-checks.outputs.cache_prune_outcome }}
          PREPARE_OUTCOME: ${{ needs.quality-checks.outputs.cache_prepare_outcome }}
          UPLOAD_OUTCOME: ${{ needs.quality-checks.outputs.cache_upload_outcome }}
          PRUNE_NEEDED: ${{ needs.quality-checks.outputs.cache_prune_needed }}
          FAILURE_REASON: ${{ needs.quality-checks.outputs.cache_failure_reason }}
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
        run: |
          set -euo pipefail
          for outcome in "$RESTORE_OUTCOME" "$INSPECT_OUTCOME" "$PRUNE_OUTCOME" \
            "$PREPARE_OUTCOME" "$UPLOAD_OUTCOME"; do
            if [[ $outcome == failure ]]; then
              echo "${FAILURE_REASON:-A Bazel cache operation failed.}" >&2
              exit 1
            fi
          done
          if [[ $PREPARE_OUTCOME == success && $UPLOAD_OUTCOME != success ]]; then
            echo "Cache preparation succeeded but snapshot upload was not successful." >&2
            exit 1
          fi
          if [[ $QUALITY_RESULT == success || $QUALITY_RESULT == failure ]] &&
            [[ -z $RESTORE_OUTCOME || -z $INSPECT_OUTCOME || -z $PREPARE_OUTCOME || -z $UPLOAD_OUTCOME ]]; then
            echo "Cache outcomes are missing from the quality-checks job." >&2
            exit 1
          fi
          if [[ $PRUNE_NEEDED == true ]]; then
            if [[ $PRUNE_OUTCOME != success || $PREPARE_OUTCOME != success || $UPLOAD_OUTCOME != success ]]; then
              echo "Required cache pruning, validation, preparation, or upload was not successful." >&2
              exit 1
            fi
            echo "Cache pruning completed and the validated snapshot was uploaded."
          fi

  arm64-validation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    env:
      COMPOSE_PARALLEL_LIMIT: 1
      REGISTRY_CACHE_SUFFIX: "-arm64"
      GOOGLE_OAUTH_REDIRECT_URL: https://recipes.example/oauth2/callback
      GOOGLE_OAUTH_REDIRECT_HOST: recipes.example
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true

      - name: verify exact source revision
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [[ $source_sha != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked out $source_sha, expected event source $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi
          echo "Building exact source revision $source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: setup mise
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: install Compose generation tools
        run: mise --no-hooks install jq yq ytt oras

      - name: login to ghcr.io for ARM64 build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: prepare ARM64 build context without devcontainers
        run: |
          echo "::group::verify ARM64 runner and Docker daemon"
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "Expected a native ARM64 runner, got $(uname -m)." >&2; exit 1 ;;
          esac
          case "$(docker info --format '{{.Architecture}}')" in
            aarch64|arm64) ;;
            *) echo "Expected a native ARM64 Docker daemon." >&2; exit 1 ;;
          esac
          echo "::endgroup::"
          echo "::group::prepare ARM64 build context"
          docker buildx create --use
          docker buildx inspect --bootstrap
          mise run --raw sync-files
          mise run --raw generate-docker-compose
          mise run create-intranet
          echo "::endgroup::"

      - name: build development and standalone test images
        run: docker compose --progress plain --profile development --profile test build

      - name: test migrators
        run: bash .scripts/run-migrator-tests.sh

      - name: verify production ingress trust
        run: mise run test-auth-ingress

      - name: start development stack and run standalone integration tests
        id: integration-tests
        env:
          VERBOSE: "true"
        run: |
          echo "::group::start development stack"
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          echo "::endgroup::"
          mise run integration-tests -- --development

      - name: capture ARM64 Compose logs
        if: failure() && steps.integration-tests.outcome == 'failure'
        run: docker compose --profile test logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1

      - name: upload ARM64 Compose logs
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: arm64-compose-logs
          path: ${{ runner.temp }}/compose.log
          if-no-files-found: error
          retention-days: 7

      - name: upload ARM64 end-to-end screenshots, ARIA snapshots and reports
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: arm64-e2e-reports
          path: |
            e2e-test/target/
            recipe-edit-test/target/
          if-no-files-found: ignore
          retention-days: 7

      - name: verify development and test images are native ARM64
        run: |
          set -euo pipefail
          mapfile -t images < <(docker compose --profile development --profile test config --images | sort -u)
          for image in "${images[@]}"; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/arm64 ]]; then
              echo "$image was built for $platform, expected linux/arm64." >&2
              exit 1
            fi
          done

      - name: clean up development and test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: check for an existing complete release
        id: check-existing-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          result=$(sh .scripts/check-production-release.sh "${{ steps.source.outputs.sha }}")
          if [[ $result == found:* ]]; then
            echo "status=found" >> "$GITHUB_OUTPUT"
          else
            echo "status=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: build and validate production ARM64 images
        if: >-
          github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.check-existing-release.outputs.status != 'found'
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/production-build-arm64.json"
          is_main=false
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]; then
            is_main=true
          fi
          write_cache=false
          if [[ $is_main == true ]]; then
            write_cache=true
          fi
          sh .scripts/generate-production-build-metadata.sh \
            "${{ steps.source.outputs.sha }}" linux/arm64 "$metadata" "$write_cache"
          if [[ $is_main == true ]]; then
            docker buildx bake --file "$metadata" --push
          else
            docker buildx bake --file "$metadata" --load
          fi
          mapfile -t images < <(jq -r '.target[] | .tags[0]' "$metadata")
          for image in "${images[@]}"; do
            if [[ $is_main == true ]]; then
              docker pull --platform linux/arm64 "$image"
            fi
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/arm64 ]]; then
              echo "$image was built for $platform, expected linux/arm64." >&2
              exit 1
            fi
          done
          smoke_image=$(jq -r '.target.design.tags[0]' "$metadata")
          sh .scripts/smoke-production-image.sh "$smoke_image"

      - name: upload integration reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-integration-reports
          path: |
            **/target/integration-tests/**
            **/target/surefire-reports/**
            **/target/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  publish-devcontainers:
    needs:
      - quality-checks
      - arm64-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: verify exact source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [[ $source_sha != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked out $source_sha, expected event source $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi
          echo "Building exact source revision $source_sha"

      - name: setup mise tools
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: create buildx builder
        run: docker buildx create --use

      - name: install tools and synchronize
        env:
          MISE_JOBS: "1"
        run: mise install

      - name: build and push devcontainers
        run: |
          for project in $(ls */.project.yaml | xargs dirname); do
            has_publish=$(mise exec -- yq eval 'select(documentIndex==0) | .devcontainer.publish.image // ""' "$project/.project.yaml")
            if [ -z "$has_publish" ]; then
              continue
            fi
            echo "::group::build and push devcontainer $project"
            sh $project/.update_devcontainer.sh --build --push-cache -vv
            echo "::endgroup::"
          done

  publish-release:
    needs:
      - quality-checks
      - arm64-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_PARALLEL_LIMIT: 1
      GOOGLE_OAUTH_REDIRECT_URL: https://recipes.example/oauth2/callback
      GOOGLE_OAUTH_REDIRECT_HOST: recipes.example
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: verify exact source revision
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [[ $source_sha != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked out $source_sha, expected event source $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi
          echo "Building exact source revision $source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: setup mise tools
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: create buildx builder
        run: docker buildx create --use

      - name: install tools and synchronize
        env:
          MISE_JOBS: "1"
        run: mise install

      - name: build, publish, and verify production release
        id: production-release
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/release.json"
          result=$(sh .scripts/check-production-release.sh "$SOURCE_REVISION" "$inventory")
          if [[ $result == found:* ]]; then
            digest=${result#found:}
            echo "Reusing complete release inventory: ghcr.io/dhhyi/recipe-db-releases@$digest"
          else
            metadata="$RUNNER_TEMP/production-build-amd64.json"
            sh .scripts/generate-production-build-metadata.sh \
              "$SOURCE_REVISION" linux/amd64 "$metadata" true
            docker buildx bake --file "$metadata" --push
            smoke_image=$(jq -r '.target.design.tags[0]' "$metadata")
            docker pull --platform linux/amd64 "$smoke_image"
            sh .scripts/smoke-production-image.sh "$smoke_image"

            while IFS= read -r architecture_image; do
              image=${architecture_image%-amd64}
              docker buildx imagetools create \
                --tag "$image" \
                "$architecture_image" \
                "$image-arm64"
            done < <(jq -r '.target[] | .tags[0]' "$metadata")

            sh .scripts/create-production-release-inventory.sh "$SOURCE_REVISION" "$inventory"
            sh .scripts/publish-production-release.sh "$inventory" "$SOURCE_REVISION"
          fi
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"

      - name: update compatibility latest tags
        if: success()
        run: |
          set -euo pipefail
          current_revision=$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')
          if [[ $current_revision != "${{ steps.source.outputs.sha }}" ]]; then
            echo "Skipping latest tags because ${{ steps.source.outputs.sha }} is no longer the main-branch head."
            exit 0
          fi
          inventory='${{ steps.production-release.outputs.inventory }}'
          while IFS=$'\t' read -r project image; do
            repository="ghcr.io/dhhyi/recipe-db-$project"
            docker buildx imagetools create --tag "$repository:latest" "$image"
          done < <(jq -r '.images | to_entries[] | [.key, .value] | @tsv' "$inventory")
