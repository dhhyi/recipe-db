name: Publish
concurrency:
  group: publish
  cancel-in-progress: true
on:
  push:
    branches:
      - main

jobs:
  test-and-publish:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_PARALLEL_LIMIT: 1
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup mise tools
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: create buildx builder
        run: docker buildx create --use

      - name: install tools and synchronize
        run: mise install

      - name: report versions
        run: |
          set -x
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: format project files
        run: |
          pnpm exec prettier --log-level warn --write .
          mise run --raw generate-bazel-build
          targets=$(mise exec -- bazelisk query 'attr(name, "_format$", //:all)')
          mapfile -t format_targets <<< "$targets"
          mise exec -- bazelisk build --action_env=PATH --jobs=1 "${format_targets[@]}"
          for target in "${format_targets[@]}"; do
            project=${target#//:}
            tar -xf "bazel-bin/${project%_format}-format.tar"
          done
          git diff --exit-code

      - name: build dev images
        run: |
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          echo "::group::docker compose build"
          docker compose --profile development build
          echo "::endgroup::"

      - name: test projects
        env:
          VERBOSE: "true"
        run: |
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          echo "::group::docker compose up"
          docker compose up -d --wait || (docker compose logs && exit 1)
          echo "::endgroup::"
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          for project in $(ls */.project.yaml | xargs dirname); do
            test_cmd=$(mise exec -- yq eval 'select(documentIndex==1) | .test // ""' $project/.project.yaml)
            if [ -n "$test_cmd" ]; then
              echo "::group::test $project"
              if ! mise run --raw in-devcontainer "$project" test; then
                echo "::group::docker compose logs"
                docker compose logs --no-color
                echo "::endgroup::"
                exit 1
              fi
              echo "::endgroup::"
            fi
          done

      - name: Bazel precommit check
        run: |
          mise run --raw generate-bazel-build
          mise exec -- bazelisk build --action_env=PATH --jobs=1 //:all

      - name: build and push prod images
        run: |
          echo "::group::generate prod docker-compose.yml"
          mise run generate-docker-compose prod
          echo "::endgroup::"
          echo "::group::docker-compose.yml"
          cat docker-compose.yml
          echo "::endgroup::"
          echo "::group::docker compose build"
          docker compose build
          echo "::endgroup::"
          echo "::group::docker compose push"
          docker compose push
          echo "::endgroup::"

      - name: build and push devcontainers
        run: |
          for project in $(ls */.project.yaml | xargs dirname); do
            echo "::group::build and push devcontainer $project"
            sh $project/.update_devcontainer.sh --build --push-cache -vv
            echo "::endgroup::"
          done
