name: Publish
concurrency:
  group: publish-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action != 'edited' ||
         (contains(github.event.changes.title.from, '[WIP]') &&
          !contains(github.event.pull_request.title, '[WIP]'))) }}
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
permissions:
  contents: read

env:
  BUILDKIT_PROGRESS: quiet
  COMPOSE_PROGRESS: quiet

jobs:
  quality-checks:
    # Only removing [WIP] retriggers validation on edits, without another commit.
    if: >-
      (github.event_name != 'pull_request' ||
       !contains(github.event.pull_request.title, '[WIP]')) &&
      (github.event.action != 'edited' ||
       contains(github.event.changes.title.from, '[WIP]'))
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PARALLEL_LIMIT: 1
      DEVCONTAINER_KEEP_RUNNING: "true"
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup mise tools
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: install tools and synchronize
        run: mise install

      - name: report versions
        run: |
          set -x
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-

      - name: format project files
        run: |
          pnpm exec prettier --log-level warn --write .
          echo "::group::generate format targets"
          mise run --raw generate-bazel-build
          targets=$(mise exec -- bazelisk query 'attr(name, "_format$", //:all)')
          mapfile -t format_targets <<< "$targets"
          echo "::endgroup::"
          mise exec -- bazelisk build \
            --action_env=PATH \
            --action_env=CI \
            --action_env=GITHUB_ACTIONS \
            --action_env=BUILDKIT_PROGRESS \
            --action_env=COMPOSE_PROGRESS \
            --action_env=COMPOSE_PARALLEL_LIMIT \
            --action_env=DEVCONTAINER_KEEP_RUNNING \
            --jobs=1 --disk_cache="$HOME/.cache/bazel-disk" "${format_targets[@]}"
          echo "::group::extract formatted files and check diff"
          for target in "${format_targets[@]}"; do
            project=${target#//:}
            tar -xf "bazel-bin/${project%_format}-format.tar"
          done
          git diff --exit-code
          echo "::endgroup::"

      - name: Bazel precommit checks and unit tests
        run: |
          mise run --raw generate-bazel-build
          mise exec -- bazelisk build \
            --action_env=PATH \
            --action_env=CI \
            --action_env=GITHUB_ACTIONS \
            --action_env=BUILDKIT_PROGRESS \
            --action_env=COMPOSE_PROGRESS \
            --action_env=COMPOSE_PARALLEL_LIMIT \
            --action_env=DEVCONTAINER_KEEP_RUNNING \
            --jobs=1 --disk_cache="$HOME/.cache/bazel-disk" //:all

      - name: validate message bus integration and recovery
        run: mise run test-message-bus

      - name: build and validate production AMD64 images for pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *) echo "Expected a native AMD64 runner, got $(uname -m)." >&2; exit 1 ;;
          esac
          metadata="$RUNNER_TEMP/production-build-amd64.json"
          sh .scripts/generate-production-build-metadata.sh \
            "$GITHUB_SHA" linux/amd64 "$metadata" false
          docker buildx create --use
          docker buildx inspect --bootstrap
          docker buildx bake --file "$metadata" --load
          mapfile -t images < <(jq -r '.target[] | .tags[0]' "$metadata")
          for image in "${images[@]}"; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/amd64 ]]; then
              echo "$image was built for $platform, expected linux/amd64." >&2
              exit 1
            fi
          done
          smoke_image=$(jq -r '.target.design.tags[0]' "$metadata")
          sh .scripts/smoke-production-image.sh "$smoke_image"

  arm64-validation:
    if: >-
      (github.event_name != 'pull_request' ||
       !contains(github.event.pull_request.title, '[WIP]')) &&
      (github.event.action != 'edited' ||
       contains(github.event.changes.title.from, '[WIP]'))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    outputs:
      release_status: ${{ steps.check-existing-release.outputs.status }}
      release_digest: ${{ steps.check-existing-release.outputs.digest }}
    env:
      COMPOSE_PARALLEL_LIMIT: 1
      REGISTRY_CACHE_SUFFIX: "-arm64"
      GOOGLE_OAUTH_REDIRECT_URL: https://recipes.example/oauth2/callback
      GOOGLE_OAUTH_REDIRECT_HOST: recipes.example
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: install Compose generation tools
        run: mise --no-hooks install jq yq ytt oras

      - name: login to ghcr.io for ARM64 build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: prepare ARM64 build context without devcontainers
        run: |
          echo "::group::verify ARM64 runner and Docker daemon"
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "Expected a native ARM64 runner, got $(uname -m)." >&2; exit 1 ;;
          esac
          case "$(docker info --format '{{.Architecture}}')" in
            aarch64|arm64) ;;
            *) echo "Expected a native ARM64 Docker daemon." >&2; exit 1 ;;
          esac
          echo "::endgroup::"
          echo "::group::prepare ARM64 build context"
          docker buildx create --use
          docker buildx inspect --bootstrap
          mise run --raw sync-files
          mise run --raw generate-docker-compose
          mise run create-intranet
          echo "::endgroup::"

      - name: build development and standalone test images
        run: docker compose --profile development --profile test build

      - name: verify production ingress trust
        run: mise run test-auth-ingress

      - name: start development stack and run standalone integration tests
        id: integration-tests
        env:
          VERBOSE: "true"
        run: |
          echo "::group::start development stack"
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          echo "::endgroup::"
          mise run integration-tests -- --development

      - name: capture ARM64 Compose logs
        if: failure() && steps.integration-tests.outcome == 'failure'
        run: docker compose --profile test logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1

      - name: upload ARM64 Compose logs
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: arm64-compose-logs
          path: ${{ runner.temp }}/compose.log
          if-no-files-found: error

      - name: upload ARM64 end-to-end screenshots, ARIA snapshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-e2e-reports
          path: e2e-test/target/
          if-no-files-found: ignore

      - name: verify development and test images are native ARM64
        run: |
          set -euo pipefail
          mapfile -t images < <(docker compose --profile development --profile test config --images | sort -u)
          for image in "${images[@]}"; do
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/arm64 ]]; then
              echo "$image was built for $platform, expected linux/arm64." >&2
              exit 1
            fi
          done

      - name: clean up development and test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: check for an existing complete release
        id: check-existing-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          result=$(sh .scripts/check-production-release.sh "$GITHUB_SHA")
          if [[ $result == found:* ]]; then
            echo "status=found" >> "$GITHUB_OUTPUT"
            echo "digest=${result#found:}" >> "$GITHUB_OUTPUT"
          else
            echo "status=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: build and validate production ARM64 images
        if: >-
          github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.check-existing-release.outputs.status != 'found'
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/production-build-arm64.json"
          is_main=false
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]; then
            is_main=true
          fi
          write_cache=false
          if [[ $is_main == true ]]; then
            write_cache=true
          fi
          sh .scripts/generate-production-build-metadata.sh \
            "$GITHUB_SHA" linux/arm64 "$metadata" "$write_cache"
          if [[ $is_main == true ]]; then
            docker buildx bake --file "$metadata" --push
          else
            docker buildx bake --file "$metadata" --load
          fi
          mapfile -t images < <(jq -r '.target[] | .tags[0]' "$metadata")
          for image in "${images[@]}"; do
            if [[ $is_main == true ]]; then
              docker pull --platform linux/arm64 "$image"
            fi
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            if [[ $platform != linux/arm64 ]]; then
              echo "$image was built for $platform, expected linux/arm64." >&2
              exit 1
            fi
          done
          smoke_image=$(jq -r '.target.design.tags[0]' "$metadata")
          sh .scripts/smoke-production-image.sh "$smoke_image"

      - name: upload integration reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-integration-reports
          path: |
            **/target/integration-tests/**
            **/target/surefire-reports/**
            **/target/junit.xml
          if-no-files-found: ignore

  publish:
    needs:
      - quality-checks
      - arm64-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_PARALLEL_LIMIT: 1
      GOOGLE_OAUTH_REDIRECT_URL: https://recipes.example/oauth2/callback
      GOOGLE_OAUTH_REDIRECT_HOST: recipes.example
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup mise tools
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: create buildx builder
        run: docker buildx create --use

      - name: install tools and synchronize
        run: mise install

      - name: build, publish, and verify production release
        id: production-release
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/release.json"
          if [[ '${{ needs.arm64-validation.outputs.release_status }}' == found ]]; then
            digest='${{ needs.arm64-validation.outputs.release_digest }}'
            oras pull "ghcr.io/dhhyi/recipe-db-releases@$digest" --output "$RUNNER_TEMP/existing-release"
            inventory="$RUNNER_TEMP/existing-release/release.json"
            sh .scripts/validate-production-release.sh "$inventory" "$GITHUB_SHA"
            echo "Reusing complete release inventory: ghcr.io/dhhyi/recipe-db-releases@$digest"
          else
            metadata="$RUNNER_TEMP/production-build-amd64.json"
            sh .scripts/generate-production-build-metadata.sh \
              "$GITHUB_SHA" linux/amd64 "$metadata" true
            docker buildx bake --file "$metadata" --push
            smoke_image=$(jq -r '.target.design.tags[0]' "$metadata")
            docker pull --platform linux/amd64 "$smoke_image"
            sh .scripts/smoke-production-image.sh "$smoke_image"

            while IFS= read -r project; do
              image="ghcr.io/dhhyi/recipe-db-$project"
              docker buildx imagetools create \
                --tag "$image:sha-$GITHUB_SHA" \
                "$image:sha-$GITHUB_SHA-amd64" \
                "$image:sha-$GITHUB_SHA-arm64"
            done < <(jq -r '.target | keys[]' "$metadata")

            sh .scripts/create-production-release-inventory.sh "$GITHUB_SHA" "$inventory"
            sh .scripts/publish-production-release.sh "$inventory" "$GITHUB_SHA"
          fi
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"

      - name: update compatibility latest tags
        if: success()
        run: |
          set -euo pipefail
          current_revision=$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')
          if [[ $current_revision != "$GITHUB_SHA" ]]; then
            echo "Skipping latest tags because $GITHUB_SHA is no longer the main-branch head."
            exit 0
          fi
          inventory='${{ steps.production-release.outputs.inventory }}'
          while IFS=$'\t' read -r project image; do
            repository="ghcr.io/dhhyi/recipe-db-$project"
            docker buildx imagetools create --tag "$repository:latest" "$image"
          done < <(jq -r '.images | to_entries[] | [.key, .value] | @tsv' "$inventory")

      - name: build and push devcontainers
        run: |
          for project in $(ls */.project.yaml | xargs dirname); do
            has_publish=$(mise exec -- yq eval 'select(documentIndex==0) | .devcontainer.publish.image // ""' "$project/.project.yaml")
            if [ -z "$has_publish" ]; then
              continue
            fi
            echo "::group::build and push devcontainer $project"
            sh $project/.update_devcontainer.sh --build --push-cache -vv
            echo "::endgroup::"
          done
