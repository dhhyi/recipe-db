# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  build:
    packages:
      - nginx
      # official node >=25 linux binaries are linked against libatomic
      - libatomic1
    args:
      NGINX_FORMATTER_VERSION: "2.3.0"
    root:
      - ADD https://github.com/soulteary/nginx-formatter/releases/download/v${NGINX_FORMATTER_VERSION}/nginx-formatter_${NGINX_FORMATTER_VERSION}_linux_amd64.tar.gz /tmp/nginx-formatter.tar.gz
      - RUN tar -xvf /tmp/nginx-formatter.tar.gz -C /tmp
        && mv /tmp/nginx-formatter /usr/local/bin/nginx-formatter
      - RUN rm -rf /etc/nginx/sites-enabled/default && chmod -R 777 /usr/share/nginx/html
    user:
      # mise's aqua registry cannot resolve pnpm assets, so use the npm backend
      - RUN mise use -g node@26 npm:pnpm@11
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-images-edit
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  ports:
    - 80
  environment:
    TESTING: "true"
  initialize: |
    sudo ln -sf ${containerWorkspaceFolder}/nginx.conf /etc/nginx/conf.d/default.conf
    sudo ln -sf ${containerWorkspaceFolder}/index.html /usr/share/nginx/html/index.html
    sudo /etc/init.d/nginx start
    cd ${containerWorkspaceFolder}
    pnpm install
    pnpm codegen
    pnpm build && cp -f elm.js /usr/share/nginx/html/elm.js
vscode:
  settings:
    peacock.remoteColor: "#995d51"
    "[elm]":
      editor.defaultFormatter: elmTooling.elm-ls-vscode
    filewatcher.commands:
      - match: "\\.elm"
        cmd: cd ${workspaceRoot} && pnpm build && cp -fv elm.js /usr/share/nginx/html/elm.js
        event: onFileChange
      - match: "nginx.conf"
        cmd: sudo /etc/init.d/nginx reload
        event: onFileChange
      - match: "\\.graphql"
        cmd: cd ${workspaceRoot} && pnpm codegen
        event: onFolderChange
  extensions:
    - johnpapa.vscode-peacock
    - appulate.filewatcher
    - GraphQL.vscode-graphql
    - elmTooling.elm-ls-vscode
extras:
  - traefik
  - named-volumes
namedVolumes:
  $HOME/.elm: recipe-db-images-edit-elm-cache
  .pnpm-store: recipe-db-images-edit-pnpm-store
  node_modules: recipe-db-images-edit-node-modules
  elm-stuff: recipe-db-images-edit-elm-stuff
traefik:
  network: intranet
  labels:
    http:
      services:
        recipe-db-images-edit:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        images-edit:
          rule: PathPrefix(`/images`)
          entrypoints: web
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: frontend
prettier:
  ignore:
    - "*.elm"
    - nginx.conf
    - elm.json
precommit: |
  pnpm exec elm --version
  nginx-formatter -indent=4
  npx prettier --tab-width 4 --print-width 10 --ignore-path /dev/null --write elm.json
  pnpm exec elm-format --yes .
  pnpm codegen
  pnpm build
  pnpm lint
