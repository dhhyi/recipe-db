# pnpm 11 only reads storeDir from here, not from .npmrc - keep it project-local so it can be a named volume
storeDir: .pnpm-store
packageImportMethod: copy
allowBuilds:
  elm: true
  elm-format: true
# TODO: Remove this override and patch when folder-hash can be upgraded to a release with the minimatch compatibility fix.
overrides:
  folder-hash>minimatch: ^11.0.1
patchedDependencies:
  folder-hash@3.3.5: patches/folder-hash@3.3.5.patch
