# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  name: recipe-db-images-test
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-images-test
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    args:
      HURL_VERSION: 8.0.1
    packages:
      - libcurl4
      - libxml2
    root:
      - ADD https://github.com/Orange-OpenSource/hurl/releases/download/$HURL_VERSION/hurl-$HURL_VERSION-x86_64-unknown-linux-gnu.tar.gz /tmp/hurl.tar.gz
      - RUN tar -xzf /tmp/hurl.tar.gz -C /tmp && mv /tmp/hurl-$HURL_VERSION-x86_64-unknown-linux-gnu/bin/hurl /usr/local/bin/hurl && mv /tmp/hurl-$HURL_VERSION-x86_64-unknown-linux-gnu/bin/hurlfmt /usr/local/bin/hurlfmt && chmod +rx /usr/local/bin/hurl /usr/local/bin/hurlfmt && rm -rf /tmp/hurl.tar.gz /tmp/hurl-$HURL_VERSION-x86_64-unknown-linux-gnu
  environment:
    MISE_IGNORED_CONFIG_PATHS: "/workspaces/*/mise.toml"
    REST_API: http://traefik:3000
    WEB_API: http://traefik
vscode:
  settings:
    window.title: "${dirty}${rootName}${separator}${profileName}${separator}"
    peacock.remoteColor: "#5dc993"
  extensions:
    - johnpapa.vscode-peacock
extras:
  - traefik
traefik:
  network: intranet
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: test
format: hurlfmt --in-place *.hurl
check: hurl --version
test: sh hurl-run
prettier:
  ignore:
    - "*.hurl"
    - fixtures
