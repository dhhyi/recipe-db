# yaml-language-server: $schema=https://raw.githubusercontent.com/dhhyi/devcontainer-creator/dist/language_schema.json
extends: dcc://debian
devcontainer:
  publish:
    image: ghcr.io/dhhyi/recipe-db-devcontainer-link-extract
    labels:
      org.opencontainers.image.source: https://github.com/dhhyi/recipe-db
  build:
    packages:
      - build-essential
      - libevent-dev
      - libgc-dev
      - libssl-dev
      - libxml2-dev
      - libyaml-dev
      - pkg-config
      - zlib1g-dev
    user:
      - RUN mise use -g crystal@1.17.1
  ports:
    - 8081
vscode:
  settings:
    peacock.remoteColor: "#cbfe12"
  extensions:
    - johnpapa.vscode-peacock
extras:
  - traefik
traefik:
  network: intranet
  labels:
    http:
      services:
        recipe-db-link-extract:
          loadBalancer:
            healthCheck:
              interval: 10s
              timeout: 1s
              path: /health
      routers:
        link-extract:
          rule: PathPrefix(`/link-extract`)
          entrypoints: rest-internal
---
# yaml-language-server: $schema=../.scripts/project-schema.json
category: backend
prettier:
  ignore:
    - "*.cr"
    - shard.yml
    - target
precommit: |
  crystal --version
  crystal tool format
  mkdir -p target
  crystal build main.cr -o target/precommit.out
