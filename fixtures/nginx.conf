server {
  listen 80 default_server;
  listen [::]:80 default_server;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/mime.types;

  location = /link-extract-test-fixture/page {
    default_type text/html;
    try_files /link-extract-test-fixture/page.html =404;
  }

  location = /link-extract-test-fixture/canonical {
    default_type text/html;
    try_files /link-extract-test-fixture/canonical.html =404;
  }

  location = /graphql-test-fixture/canonical {
    default_type text/html;
    try_files /graphql-test-fixture/canonical.html =404;
  }

  location = /link-extract-test-fixture/plain {
    default_type text/plain;
    return 200 "plain text";
  }

  location = /graphql-test-fixture/favicon.ico {
    default_type image/x-icon;
    return 200 "icon";
  }

  location = /link-extract-test-fixture/favicon.ico {
    default_type image/x-icon;
    return 200 "icon";
  }

  location = /mcp-test-fixture/redirect.jpg {
    if ($http_authorization != "") { return 403; }
    return 302 http://fixtures/mcp-test-fixture/credential-free.jpg;
  }

  location = /mcp-test-fixture/credential-free.jpg {
    if ($http_authorization != "") { return 403; }
    try_files /mcp-test-fixture/test.jpg =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
