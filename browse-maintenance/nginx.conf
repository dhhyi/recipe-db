server {
    listen 80;
    server_name _;
    default_type text/html;
    add_header Cache-Control "no-store" always;

    error_page 503 =503 /_maintenance;

    location / {
        return 503;
    }

    location = /_maintenance {
        internal;
        alias /usr/share/nginx/html/unavailable.html;
    }
}
