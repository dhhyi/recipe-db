plugins {
	id 'groovy'
	id 'com.diffplug.spotless' version '7.0.2'
}

repositories {
	mavenCentral()
}

layout.buildDirectory = file('target/build')

dependencies {
	testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
	testImplementation 'io.rest-assured:rest-assured:5.5.6'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

spotless {
	groovy {
		target providers.gradleProperty('spotlessFiles').map {
			it.split(',').findAll {
				it.endsWith('.groovy')
			}
		}.getOrElse(['src/**/*.groovy'])
		greclipse()
	}
	groovyGradle {
		target providers.gradleProperty('spotlessFiles').map {
			it.split(',').findAll {
				it.endsWith('.gradle')
			}
		}.getOrElse(['*.gradle'])
		greclipse()
	}
}
