plugins {
	id 'groovy'
	id 'com.diffplug.spotless' version '7.0.2'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
	testImplementation 'io.rest-assured:rest-assured:5.5.6'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

spotless {
	groovy {
		target 'src/**/*.groovy'
		greclipse()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}
