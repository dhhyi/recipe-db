fragment Rating on Rating {
  recipeId
  average
  count
}

fragment RecipeStub on Recipe {
  id
  name
  image {
    url
    thumbUrl
  }
  rating {
    ...Rating
  }
}

query Overview {
  recipes {
    ...RecipeStub
  }
  recipeEditOnline: isServiceOnline(name: "recipes-edit")
  ratingsOnline: isServiceOnline(name: "ratings")
}

fragment RecipeDetail on Recipe {
  id
  name
  method
  image {
    url
    thumbUrl
  }
  ingredients {
    name
    amount
    unit
    optional
  }
  rating {
    ...Rating
  }
  inspirations {
    url
  }
}

query RecipeById($id: ID!) {
  recipe(id: $id) {
    ...RecipeDetail
  }
  recipeEditOnline: isServiceOnline(name: "recipes-edit")
  imageEditOnline: isServiceOnline(name: "images-edit")
  ratingsOnline: isServiceOnline(name: "ratings")
  inspirationsOnline: isServiceOnline(name: "inspirations")
}

fragment InspirationsLink on Link {
  url
  extracted {
    title
    description
    canonical
    inlinedFavicon
  }
}

query RecipeInspirations($id: ID!) {
  recipe(id: $id) {
    id
    inspirations {
      ...InspirationsLink
    }
  }
  inspirationsOnline: isServiceOnline(name: "inspirations")
}

mutation RateRecipe($id: ID!, $rating: Int!, $login: String!) {
  rate(id: $id, rating: $rating, login: $login) {
    ...Rating
  }
}
